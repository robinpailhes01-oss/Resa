  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const DUR = 5.7;
      const GLOBAL_START = 45.1;
      const CREAM = "#fbf6ea";

      // ── countdown chip: overtime « +0:SS » = floor(global_start + t) − 45, discrete swaps ──
      const num = document.getElementById("f07r-chip-num");
      const cds = [];
      for (let s = Math.floor(GLOBAL_START); s <= Math.floor(GLOBAL_START + DUR); s++) {
        const o = Math.max(0, s - 45);
        const el = document.createElement("span");
        el.className = "f07r-cd";
        el.textContent = "+0:" + String(o).padStart(2, "0");
        num.appendChild(el);
        cds.push({ el, t0: Math.max(0, s - GLOBAL_START) });
      }
      cds.forEach((c, i) => {
        if (i === 0) gsap.set(c.el, { opacity: 1 });
        else {
          tl.set(c.el, { opacity: 1 }, c.t0);
          tl.set(cds[i - 1].el, { opacity: 0 }, c.t0);
          // light pulse on each new overtime second
          tl.fromTo("#f07r-chip", { scale: 1.08 }, { scale: 1, duration: 0.25, ease: "power2.out", immediateRender: false }, c.t0);
        }
      });

      // ── typewriter helper: fixed per-character schedule ──
      function typeInto(target, segments, t0, per) {
        const host = document.getElementById(target);
        const chars = [];
        segments.forEach(([text, tag]) => {
          let parent = host;
          if (tag) {
            parent = document.createElement(tag);
            host.appendChild(parent);
          }
          for (const ch of text) {
            const s = document.createElement("span");
            s.textContent = ch;
            s.style.display = "none";
            parent.appendChild(s);
            chars.push(s);
          }
        });
        chars.forEach((s, i) => tl.set(s, { display: "inline" }, t0 + i * per));
        return t0 + chars.length * per;
      }

      // ── stamp helper: scale 1.6 → 1 in 0.18s + panel shake ──
      function stamp(st, shake, t) {
        tl.fromTo(st, { opacity: 0, scale: 1.6, rotation: -14 }, { opacity: 1, scale: 1, rotation: -8, duration: 0.18, ease: "power3.in", immediateRender: true }, t);
        tl.fromTo(shake, { x: 0, y: 0 }, { keyframes: [{ x: -9, y: 6, duration: 0.05 }, { x: 7, y: -4, duration: 0.05 }, { x: -3, y: 2, duration: 0.05 }, { x: 0, y: 0, duration: 0.06 }], ease: "none", immediateRender: false }, t + 0.18);
      }
      function caption(c, t) {
        tl.fromTo(c, { opacity: 0, y: 26, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.34, ease: "expo.out", immediateRender: true }, t);
      }

      // ── ground + scene: slow push, keeps everything alive ──
      tl.fromTo("#f07r-ground-in", { scale: 1, x: 0 }, { scale: 1.05, x: -40, duration: DUR, ease: "none" }, 0);
      tl.fromTo("#f07r-scene", { scale: 1.0 }, { scale: 1.03, duration: DUR, ease: "sine.inOut" }, 0);

      // ══ Scene 1 (0–2.2) : « Bientôt » + client card, « 2 mois » ══
      tl.fromTo("#f07r-bientot", { opacity: 0, scale: 1.6, rotation: -9 }, { opacity: 1, scale: 1, rotation: -3, duration: 0.18, ease: "power3.in", immediateRender: true }, 0.08);
      tl.fromTo("#f07r-title", { x: 0, y: 0 }, { keyframes: [{ x: -6, y: 4, duration: 0.05 }, { x: 5, y: -2, duration: 0.05 }, { x: 0, y: 0, duration: 0.06 }], ease: "none", immediateRender: false }, 0.26);
      const wa = gsap.utils.toArray(".f07r-wa");
      const wb = gsap.utils.toArray(".f07r-wb");
      tl.fromTo(wa, { opacity: 0, y: 30, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.3, ease: "expo.out", stagger: 0.04, immediateRender: true }, 0.18);
      gsap.set(wb, { opacity: 0 });
      // karaoke A: « Cliente » 0.32 · « pas revenue » 0.97–1.4 · « depuis » 1.45 · « 2 mois » 1.68–2.2
      [0.32, 0.97, 1.16, 1.45, 1.68, 1.86].forEach((t, i) => {
        tl.to(wa[i], { color: CREAM, y: -6, duration: 0.14, ease: "power2.out" }, t);
      });

      // client card slides in on « cliente »
      tl.fromTo("#f07r-client", { opacity: 0, x: -220, y: 30, rotation: 0, scale: 1.04 }, { opacity: 1, x: 0, y: 0, rotation: -2.5, scale: 1, duration: 0.5, ease: "expo.out", immediateRender: true }, 0.3);
      tl.fromTo("#f07r-ch, #f07r-sep, .f07r-lab, #f07r-last, #f07r-soin", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: "expo.out", stagger: 0.06, immediateRender: true }, 0.42);
      // « deux mois » 1.68 : highlight sweeps behind « 2 mois », small pop
      tl.fromTo("#f07r-2m-hl", { scaleX: 0 }, { scaleX: 1, duration: 0.28, ease: "expo.out", immediateRender: true }, 1.68);
      tl.fromTo("#f07r-2m", { scale: 1 }, { keyframes: [{ scale: 1.1, duration: 0.12, ease: "power2.out" }, { scale: 1, duration: 0.22, ease: "power2.inOut" }], immediateRender: false }, 1.7);
      // amber « À relancer » pill
      gsap.set("#f07r-green", { opacity: 0, scale: 0.6 });
      tl.fromTo("#f07r-amber", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.3, ease: "expo.out", immediateRender: true }, 1.94);

      // ══ Scene 2 (2.2–4.4) : relance panel, typed message, sent ══
      tl.to(wa, { opacity: 0, y: -34, filter: "blur(10px)", duration: 0.18, ease: "power2.in", stagger: 0.02 }, 2.12);
      tl.fromTo(wb, { opacity: 0, y: 30, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.3, ease: "expo.out", stagger: 0.04, immediateRender: false }, 2.24);
      // karaoke B: « Réso » 2.3 · « lui enverra » · « un petit message » 3.42–4.0
      [2.3, 2.56, 2.76, 3.3, 3.44, 3.66].forEach((t, i) => {
        tl.to(wb[i], { color: CREAM, y: -6, duration: 0.14, ease: "power2.out" }, t);
      });

      // client card steps back a little, panel flies in from the right
      tl.to("#f07r-client", { x: -14, y: 10, rotation: -4, scale: 0.97, duration: 0.5, ease: "power2.out" }, 2.22);
      tl.fromTo("#f07r-panel", { opacity: 0, x: 260, y: 40, rotation: 3, scale: 1.04 }, { opacity: 1, x: 0, y: 0, rotation: 1, scale: 1, duration: 0.48, ease: "expo.out", immediateRender: true }, 2.22);
      tl.fromTo("#f07r-sys", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out", immediateRender: true }, 2.5);

      // typing (deterministic) 2.6 → ~3.7
      gsap.set("#f07r-caret", { opacity: 0 });
      tl.set("#f07r-ph", { opacity: 0 }, 2.58);
      tl.set("#f07r-caret", { opacity: 1 }, 2.58);
      const MSG = "Bonjour Julie, ça fait un moment ! Un créneau vous ferait plaisir cette semaine ?";
      const tEnd = typeInto("f07r-dtext", [[MSG, null]], 2.62, 0.0132);

      // SEND on the end of « message » (3.9): button press, draft clears, bubble slides up-right into the thread
      const SEND = Math.max(tEnd + 0.12, 3.9);
      tl.fromTo("#f07r-send", { scale: 1 }, { keyframes: [{ scale: 0.86, duration: 0.07, ease: "power2.in" }, { scale: 1, duration: 0.16, ease: "power2.out" }], immediateRender: false }, SEND - 0.07);
      tl.to("#f07r-send svg", { keyframes: [{ x: 10, duration: 0.1, ease: "power2.out" }, { x: 0, duration: 0.16, ease: "power2.inOut" }] }, SEND - 0.04);
      tl.to("#f07r-draft", { opacity: 0, y: -16, duration: 0.08, ease: "power2.in" }, SEND);
      tl.set("#f07r-ph", { opacity: 1 }, SEND + 0.14);
      tl.fromTo("#f07r-sent", { opacity: 0, x: -150, y: 230, scale: 0.88 }, { opacity: 1, x: 0, y: 0, scale: 1, duration: 0.44, ease: "expo.out", immediateRender: true }, SEND + 0.03);
      tl.fromTo("#f07r-ok", { opacity: 0, x: 16 }, { opacity: 1, x: 0, duration: 0.26, ease: "expo.out", immediateRender: true }, SEND + 0.3);

      // ══ Scene 3 (4.4–5.7) : booking notification, stamp, caption ══
      const DING = 4.7;
      tl.fromTo("#f07r-notif", { opacity: 0, y: 120, rotation: 0, scale: 1.04 }, { opacity: 1, y: 0, rotation: 1.8, scale: 1, duration: 0.42, ease: "expo.out", immediateRender: true }, DING);
      tl.fromTo("#f07r-notif-ico", { scale: 0.5 }, { scale: 1, duration: 0.3, ease: "expo.out", immediateRender: true }, DING + 0.08);
      // pill swap amber → green on the client card
      tl.to("#f07r-amber", { opacity: 0, scale: 0.7, duration: 0.14, ease: "power2.in" }, DING + 0.06);
      tl.to("#f07r-green", { opacity: 1, scale: 1, duration: 0.3, ease: "expo.out" }, DING + 0.16);

      const STAMP = 5.0;
      stamp("#f07r-st", "#f07r-panel", STAMP);
      caption("#f07r-cap", STAMP + 0.12);

      gsap.set(["#f07r-st", "#f07r-cap"], { opacity: 0 });

      tl.set({}, {}, DUR);
      window.__timelines["07-relance"] = tl;
    })();
