        el.textContent = "0:" + String(v).padStart(2, "0");
        num.appendChild(el);
        cds.push({ el, t0: Math.max(0, s - GLOBAL_START) });
      }
      cds.forEach((c, i) => {
        if (i === 0) gsap.set(c.el, { opacity: 1 });
        else {
          tl.set(c.el, { opacity: 1 }, c.t0);
          tl.set(cds[i - 1].el, { opacity: 0 }, c.t0);
        }
      });

      // ── typewriter helper: fixed per-character schedule ──
      function typeInto(target, segments, t0, per) {
        const host = document.getElementById(target);
        const chars = [];
        segments.forEach(([text, tag]) => {
          let parent = host;
          if (tag) {
            parent = document.createElement(tag);
            host.appendChild(parent);
          }
          for (const ch of text) {
            const s = document.createElement("span");
            s.textContent = ch;
            s.style.display = "none";
            parent.appendChild(s);
            chars.push(s);
          }
        });
        chars.forEach((s, i) => tl.set(s, { display: "inline" }, t0 + i * per));
        return t0 + chars.length * per;
      }

      // ── Scene 1 (0–1.2): "Mais ce n'est pas tout." karaoke, then becomes "Bientôt sur Reso…" ──
      const wa = gsap.utils.toArray(".f04-wa");
      const wb = gsap.utils.toArray(".f04-wb");
      tl.fromTo(wa, { opacity: 0, y: 40, scale: 1.08 }, { opacity: 1, y: 0, scale: 1, duration: 0.3, ease: "expo.out", stagger: 0.035 }, 0);
      [0.08, 0.22, 0.34, 0.6, 0.82].forEach((t, i) => {
        tl.to(wa[i], { color: CREAM, y: -6, duration: 0.14, ease: "power2.out" }, t);
      });
      tl.to("#f04-lineA", { y: -300, scale: 0.62, duration: 0.3, ease: "expo.inOut" }, 1.0);
      tl.to(wa, { opacity: 0, y: -40, filter: "blur(10px)", duration: 0.16, ease: "power2.in", stagger: 0.025 }, 1.14);
      tl.fromTo(wb, { opacity: 0, y: 30, filter: "blur(10px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.32, ease: "expo.out", stagger: 0.06 }, 1.22);
      tl.to("#f04-bientot", { color: "#f3d36b", y: -6, duration: 0.14, ease: "power2.out" }, 1.32);
      tl.to(wb.slice(1), { color: CREAM, y: -6, duration: 0.14, ease: "power2.out", stagger: 0.12 }, 1.6);

      // ── stamp helper: scale 1.6 → 1 in 0.18s + card shake ──
      function stamp(st, shake, t) {
        tl.fromTo(st, { opacity: 0, scale: 1.6, rotation: -14 }, { opacity: 1, scale: 1, rotation: -8, duration: 0.18, ease: "power3.in", immediateRender: true }, t);
        tl.fromTo(shake, { x: 0, y: 0 }, { keyframes: [{ x: -7, y: 5, duration: 0.05 }, { x: 6, y: -3, duration: 0.05 }, { x: -3, y: 2, duration: 0.05 }, { x: 0, y: 0, duration: 0.06 }], ease: "none" }, t + 0.18);
      }
      function caption(c, t) {
        tl.fromTo(c, { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.34, ease: "expo.out" }, t);
      }

      // ── Scene 2 (1.2–4.8): search card ──
      gsap.set(["#f04-st1", "#f04-st2", "#f04-st3"], { opacity: 0 });
      tl.fromTo("#f04-g1", { y: 700, rotation: 7, scale: 1.04 }, { y: 0, rotation: -1.2, scale: 1, duration: 0.5, ease: "expo.out" }, 1.3);
      const qEnd = typeInto("f04-query", [["esthéticienne Montpellier", null]], 1.7, 0.03);
      tl.set("#f04-qcaret", { opacity: 0 }, qEnd + 0.15);
      // results: rows 0,1 skeletons, Alba third
      const ROW = [0, 90, 180];
      gsap.set("#f04-sk1", { y: ROW[0] });
      gsap.set("#f04-sk2", { y: ROW[1] });
      tl.fromTo("#f04-searchlbl", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 2.5);
      tl.fromTo("#f04-sk1", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.3, ease: "expo.out" }, 2.6);
      tl.fromTo("#f04-sk2", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.3, ease: "expo.out" }, 2.7);
      tl.fromTo("#f04-alba", { opacity: 0, x: 30, y: ROW[2] - 6 }, { opacity: 1, x: 0, duration: 0.3, ease: "expo.out" }, 2.8);
      gsap.set("#f04-rank", { opacity: 0, scale: 0.6 });
      // "remonter sur Google": Alba climbs to first position
      tl.to("#f04-alba", { y: -6, scale: 1.035, borderColor: "#4a6179", boxShadow: "0 18px 40px rgba(31,39,51,0.22)", duration: 0.5, ease: "expo.inOut" }, 3.4);
      tl.to("#f04-sk1", { y: ROW[1] + 8, opacity: 0.7, duration: 0.5, ease: "expo.inOut" }, 3.42);
      tl.to("#f04-sk2", { y: ROW[2] + 8, opacity: 0.55, duration: 0.5, ease: "expo.inOut" }, 3.44);
      tl.to("#f04-rank", { opacity: 1, scale: 1, duration: 0.3, ease: "expo.out" }, 3.85);
      stamp("#f04-st1", "#f04-s1", 4.1);
      caption("#f04-c1", 4.24);

      // ── Scene 3 (4.8–6.6): search slides left (reduced), assistant card ──
      tl.to("#f04-g1", { x: -600, y: 70, scale: 0.64, rotation: -5, duration: 0.5, ease: "expo.inOut" }, 4.78);
      tl.fromTo("#f04-g2", { x: 1150, y: 40, rotation: 10, scale: 1.04 }, { x: 0, y: 0, rotation: 1.2, scale: 1, duration: 0.52, ease: "expo.out", immediateRender: true }, 4.9);
      tl.fromTo("#f04-q", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.3, ease: "expo.out", immediateRender: true }, 5.05);
      tl.fromTo("#f04-arow", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.25, ease: "expo.out", immediateRender: true }, 5.18);
      gsap.utils.toArray("#f04-dots i").forEach((d, i) => {
        tl.fromTo(d, { y: 0 }, { keyframes: [{ y: -6, duration: 0.08 }, { y: 0, duration: 0.08 }], ease: "none" }, 5.2 + i * 0.05);
      });
      tl.set("#f04-dots", { display: "none" }, 5.38);
      const aEnd = typeInto(
        "f04-atext",
        [
          ["Je vous conseille ", null],
          ["Maison Alba", "b"],
          [", institut de beauté au centre-ville.", null],
        ],
        5.38,
        0.0125
      );
      tl.set("#f04-acaret", { opacity: 0 }, aEnd + 0.1);
      gsap.set("#f04-acaret", { opacity: 1 });
      tl.fromTo("#f04-src", { opacity: 0, scale: 0.6, y: 10 }, { opacity: 1, scale: 1, y: 0, duration: 0.32, ease: "expo.out", immediateRender: true }, aEnd + 0.04);
      stamp("#f04-st2", "#f04-s2", 5.72);
      caption("#f04-c2", 5.86);

      // ── Scene 4 (6.6–9.0): cards spread apart, agent card in the centre ──
      tl.to("#f04-g1", { x: -650, y: 90, rotation: -6, duration: 0.5, ease: "expo.inOut" }, 6.55);
      tl.to("#f04-g2", { x: 650, y: 90, scale: 0.64, rotation: 5, duration: 0.5, ease: "expo.inOut" }, 6.55);
      tl.fromTo("#f04-g3", { y: 760, rotation: -6, scale: 1.04 }, { y: -14, rotation: -0.8, scale: 1, duration: 0.55, ease: "expo.out", immediateRender: true }, 6.66);
      // agent picks a salon photo (highlight walks the thumbnails, settles on the salon)
      const RX = [0, 88, 176, 264];
      gsap.set("#f04-ring", { x: RX[1], opacity: 0 });
      tl.to("#f04-ring", { opacity: 1, duration: 0.12 }, 6.95);
      [[2, 7.07], [3, 7.17], [0, 7.3]].forEach(([k, t]) => tl.set("#f04-ring", { x: RX[k] }, t));
      tl.fromTo("#f04-ring", { scale: 1 }, { keyframes: [{ scale: 1.12, duration: 0.08 }, { scale: 1, duration: 0.14 }], ease: "none" }, 7.3);
      tl.fromTo("#f04-shim", { x: 0 }, { x: 640, duration: 0.6, ease: "none" }, 6.8);
      tl.fromTo("#f04-post-photo", { opacity: 0, scale: 1.18 }, { opacity: 1, scale: 1, duration: 0.45, ease: "expo.out", immediateRender: true }, 7.38);
      stamp("#f04-st3", "#f04-s3", 7.22);
      caption("#f04-c3", 7.36);
      const pEnd = typeInto(
        "f04-ptext",
        [
          ["Nouveau : le soin visage éclat chez Maison Alba. Réservez en ligne, même le soir. ", null],
          ["#Montpellier #soinvisage", null],
        ],
        7.5,
        0.0085
      );
      // colour the hashtags: wrap last 25 chars
      const pchars = document.querySelectorAll("#f04-ptext span");
      gsap.set(Array.prototype.slice.call(pchars, pchars.length - 25), { color: "#4a6179", fontWeight: 700 });
      tl.set("#f04-pcaret", { opacity: 0 }, pEnd + 0.08);
      // press "Programmer"
      gsap.set("#f04-btn-ok", { opacity: 0 });
      gsap.set("#f04-status-ok", { opacity: 0 });
      tl.to("#f04-btn", { scale: 0.95, duration: 0.08, ease: "power2.in" }, 8.5);
      tl.to("#f04-btn", { scale: 1, duration: 0.3, ease: "expo.out" }, 8.58);
      tl.to("#f04-btn-ok", { opacity: 1, duration: 0.12 }, 8.58);
      tl.fromTo("#f04-status-ok", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.25, ease: "expo.out", immediateRender: true }, 8.64);

      // keep groups 2/3 off-stage before their entrances
      gsap.set("#f04-g2", { x: 1150 });
      gsap.set("#f04-g3", { y: 760 });

      tl.set({}, {}, DUR);
      window.__timelines["04-bientot"] = tl;
    })();
  </script>
