      <!-- countdown chip (global_start 36.2) -->
      <div id="f06a-chip">
        <svg viewBox="0 0 26 26" fill="none" stroke="#fbf6ea" stroke-width="2.4" stroke-linecap="round"><circle cx="13" cy="14.5" r="9" /><path d="M13 14.5V9.5M10 2.5h6M20.5 6.5l1.8-1.8" /></svg>

  <script src="assets/gsap.min.js"></script>
  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const DUR = 8.9;
      const GLOBAL_START = 36.2;
      const CREAM = "#fbf6ea";

      // ── countdown chip: value = max(0, 45 - floor(global_start + t)), discrete swaps ──
      // at t_global >= 45 (local 8.8) the chip turns soft red and shows the overtime « +0:0N »
      const chip = document.getElementById("f06a-chip");
      const num = document.getElementById("f06a-chip-num");
      const cds = [];
      for (let s = Math.floor(GLOBAL_START); s <= Math.floor(GLOBAL_START + DUR); s++) {
        const el = document.createElement("span");
        el.className = "f06a-cd";
        el.textContent = s >= 45 ? "+0:" + String(s - 45).padStart(2, "0") : "0:" + String(Math.max(0, 45 - s)).padStart(2, "0");
        num.appendChild(el);
        cds.push({ el, s, t0: Math.max(0, s - GLOBAL_START) });
      }
      cds.forEach((c, i) => {
        if (i === 0) gsap.set(c.el, { opacity: 1 });
        else {
          tl.set(c.el, { opacity: 1 }, c.t0);
          tl.set(cds[i - 1].el, { opacity: 0 }, c.t0);
        }
        if (c.s === 44) {
          // 0:01 : pulse, border warms to red
          tl.fromTo(chip, { scale: 1 }, { keyframes: [{ scale: 1.1, duration: 0.12, ease: "power2.out" }, { scale: 1, duration: 0.28, ease: "power2.inOut" }], immediateRender: false }, c.t0);
          tl.set(chip, { borderColor: "rgba(214,90,74,0.95)" }, c.t0);
        }
        if (c.s === 45) {
          tl.set(chip, { backgroundColor: "#D65A4A", borderColor: "#D65A4A" }, c.t0);
          tl.set(num, { width: 92 }, c.t0);
          tl.fromTo(chip, { scale: 1 }, { keyframes: [{ scale: 1.1, duration: 0.05, ease: "power2.out" }, { scale: 1.04, duration: 0.05, ease: "power2.inOut" }], immediateRender: false }, c.t0);
        }
      });

      // ── typewriter helper: fixed per-character schedule ──
      function typeInto(target, segments, t0, per) {
        const host = document.getElementById(target);
        const chars = [];
        segments.forEach(([text, tag]) => {
          let parent = host;
          if (tag) {
            parent = document.createElement(tag);
            host.appendChild(parent);
          }
          for (const ch of text) {
            const s = document.createElement("span");
            s.textContent = ch;
            s.style.display = "none";
            parent.appendChild(s);
            chars.push(s);
          }
        });
        chars.forEach((s, i) => tl.set(s, { display: "inline" }, t0 + i * per));
        return t0 + chars.length * per;
      }

      // ── camera: one state, one writer (applied on every timeline render) ──
      // focus (fx, fy) in world px is shown at screen centre (960, 540), zoom s.
      const world = document.getElementById("f06a-world");
      const cam = { fx: 870, fy: 560, s: 1.08 };
      function applyCam() {
        const tx = 960 - cam.fx * cam.s;
        const ty = 540 - cam.fy * cam.s;
        world.style.transform = "translate(" + tx.toFixed(2) + "px," + ty.toFixed(2) + "px) scale(" + cam.s.toFixed(4) + ")";
      }
      applyCam();
      tl.eventCallback("onUpdate", applyCam);

      // ── stamp helper: scale 1.6 → 1 in 0.18s + panel shake ──
      function stamp(st, shake, t) {
        tl.fromTo(st, { opacity: 0, scale: 1.6, rotation: -14 }, { opacity: 1, scale: 1, rotation: -8, duration: 0.18, ease: "power3.in", immediateRender: true }, t);
        tl.fromTo(shake, { x: 0, y: 0 }, { keyframes: [{ x: -9, y: 6, duration: 0.05 }, { x: 7, y: -4, duration: 0.05 }, { x: -3, y: 2, duration: 0.05 }, { x: 0, y: 0, duration: 0.06 }], ease: "none", immediateRender: false }, t + 0.18);
      }
      function caption(c, t) {
        tl.fromTo(c, { opacity: 0, y: 26, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.34, ease: "expo.out", immediateRender: true }, t);
      }

      // ── ground: slow push ──
      tl.fromTo("#f06a-ground-in", { scale: 1, x: 0 }, { scale: 1.05, duration: DUR, ease: "none" }, 0);
      tl.to("#f06a-ground-in", { x: -150, duration: 0.8, ease: "expo.out" }, 3.95);

      // ── agent pill activity: spinner + wave dots, finite & deterministic ──
      tl.fromTo("#f06a-spin", { rotation: 0 }, { rotation: 360 * 8, duration: DUR, ease: "none", transformOrigin: "50% 50%" }, 0);
      gsap.utils.toArray("#f06a-pdots i").forEach((d, i) => {
        for (let k = 0; k < 8; k++) {
          tl.fromTo(d, { y: 0, opacity: 0.45 }, { keyframes: [{ y: -6, opacity: 1, duration: 0.14 }, { y: 0, opacity: 0.45, duration: 0.18 }], ease: "sine.inOut", immediateRender: false }, 0.4 + k * 0.7 + i * 0.1);
        }
      });

      // ══ Scene 1 (0–1.2) : « Bientôt » stamped, subline A, pill centre → home ══
      tl.fromTo("#f06a-bientot", { opacity: 0, scale: 1.6, rotation: -9 }, { opacity: 1, scale: 1, rotation: -3, duration: 0.18, ease: "power3.in", immediateRender: true }, 0.06);
      tl.fromTo("#f06a-title", { x: 0, y: 0 }, { keyframes: [{ x: -6, y: 4, duration: 0.05 }, { x: 5, y: -2, duration: 0.05 }, { x: 0, y: 0, duration: 0.06 }], ease: "none", immediateRender: false }, 0.24);
      const wa = gsap.utils.toArray(".f06a-wa");
      const wb = gsap.utils.toArray(".f06a-wb");
      tl.fromTo(wa, { opacity: 0, y: 30, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.32, ease: "expo.out", stagger: 0.04, immediateRender: true }, 0.3);
      gsap.set(wb, { opacity: 0 });
      // karaoke A: Un agent IA (0.25–0.8) · crée vos (0.9–1.3) · Reels (1.43) · et posts (2.0–2.15)
      [0.25, 0.42, 0.62, 0.92, 1.18, 1.43, 1.98, 2.15].forEach((t, i) => {
        tl.to(wa[i], { color: CREAM, y: -6, duration: 0.14, ease: "power2.out" }, t);
      });

      // pill : appears big at screen centre on « agent IA », then settles under the title
      tl.fromTo("#f06a-pill", { opacity: 0, x: 646, y: 320, scale: 1.25 }, { opacity: 1, scale: 1.55, duration: 0.4, ease: "expo.out", immediateRender: true }, 0.28);
      tl.to("#f06a-pill", { x: 0, y: 0, scale: 1, duration: 0.5, ease: "expo.inOut" }, 0.86);

      // ══ Scene 2 (1.1–3.9) : photos grid, phone, Reel assembles, square post ══
      tl.fromTo("#f06a-photos", { opacity: 0, x: -120, scale: 1.04 }, { opacity: 1, x: 0, scale: 1, duration: 0.45, ease: "expo.out", immediateRender: true }, 1.08);
      const cells = gsap.utils.toArray(".f06a-cell");
      tl.fromTo(cells, { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.32, ease: "expo.out", stagger: 0.05, immediateRender: true }, 1.16);
      gsap.set(".f06a-ok", { opacity: 0, scale: 0.4 });

      // « Reels » 1.43 : phone rises in
      tl.fromTo("#f06a-phone", { opacity: 0, y: 260, scale: 1.04 }, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "expo.out", immediateRender: true }, 1.4);

      // photos fly from the grid into the phone (whoosh ≈ 1.55)
      const PHONE_CX = 930, PHONE_CY = 632;
      const flyHome = [
        [172, 426],
        [393, 426],
        [172, 630],
        [393, 630],
      ];
      gsap.utils.toArray(".f06a-fly").forEach((f, i) => {
        const dx = PHONE_CX - (flyHome[i][0] + 102.5);
        const dy = PHONE_CY - (flyHome[i][1] + 96);
        gsap.set(f, { opacity: 0 });
        tl.set(f, { opacity: 1 }, 1.55 + i * 0.07);
        tl.fromTo(f, { x: 0, y: 0, scale: 1, rotation: 0 }, { x: dx, y: dy, scale: 0.55, rotation: i % 2 ? 5 : -5, duration: 0.36, ease: "power3.in", immediateRender: false }, 1.55 + i * 0.07);
        tl.set(f, { opacity: 0 }, 1.91 + i * 0.07);
      });
      // phone takes the hits
      tl.fromTo("#f06a-phone", { rotation: 0 }, { keyframes: [{ rotation: -1.6, duration: 0.06 }, { rotation: 1.1, duration: 0.07 }, { rotation: 0, duration: 0.08 }], ease: "none", immediateRender: false }, 1.92);

      // Reel cuts : a new shot every 0.5s with a gentle push (keeps the phone alive to the end)
      const shots = gsap.utils.toArray(".f06a-shot");
      const CUT0 = 1.9, CUT = 0.5;
      tl.set("#f06a-wait", { opacity: 0 }, CUT0);
      let k = 0;
      for (let t = CUT0; t < DUR; t += CUT, k++) {
        const sh = shots[k % 4];
        const prev = k > 0 ? shots[(k - 1) % 4] : null;
        tl.set(sh, { opacity: 1, zIndex: k + 1 }, t);
        if (prev && prev !== sh) tl.set(prev, { opacity: 0 }, t + 0.001);
        tl.fromTo(sh.querySelector("img"), { scale: 1.16, x: k % 2 ? -8 : 8 }, { scale: 1.0, x: 0, duration: CUT + 0.05, ease: "none", immediateRender: false }, t);
      }
      // shade + overlays above the shots
      gsap.set(["#f06a-shade", "#f06a-reel-tag", "#f06a-reel-title", "#f06a-prog"], { zIndex: 50 });
      tl.fromTo("#f06a-reel-tag", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.3, ease: "expo.out", immediateRender: true }, 1.95);
      // animated title « Soin visage éclat »
      gsap.set("#f06a-spark", { opacity: 0, scale: 0.3 });
      const rEnd = typeInto("f06a-rtext", [["Soin visage éclat", null]], 2.05, 0.028);
      tl.to("#f06a-spark", { opacity: 1, scale: 1, rotation: 90, duration: 0.3, ease: "expo.out" }, rEnd);
      // edit progress bar
      tl.fromTo("#f06a-prog", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: "expo.out", immediateRender: true }, 1.95);
      tl.fromTo("#f06a-fill", { scaleX: 0 }, { scaleX: 1, duration: 1.62, ease: "power1.inOut", immediateRender: true }, 2.0);
      gsap.set("#f06a-lbl-b", { opacity: 0 });
      tl.set("#f06a-lbl-a", { opacity: 0 }, 3.62);
      tl.fromTo("#f06a-lbl-b", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.22, ease: "expo.out", immediateRender: false }, 3.62);

      // « publications » 2.15–2.8 : square post forms, caption + hashtags are written
      tl.fromTo("#f06a-post", { opacity: 0, x: 90, scale: 0.92, rotation: 3 }, { opacity: 1, x: 0, scale: 1, rotation: 2, duration: 0.42, ease: "expo.out", immediateRender: true }, 2.15);
      tl.fromTo("#f06a-post-img img", { scale: 1.25 }, { scale: 1.05, duration: 1.6, ease: "expo.out", immediateRender: true }, 2.15);
      gsap.set("#f06a-pcaret", { opacity: 0 });
      tl.set("#f06a-pcaret", { opacity: 1 }, 2.4);
      const pEnd = typeInto(
        "f06a-ptext",
        [
          ["Nouveau au salon : le soin visage éclat. Réservez en ligne ! ", null],
          ["#soinvisage #institut", "i"],
        ],
        2.44,
        0.0185
      );
      tl.set("#f06a-pcaret", { opacity: 0 }, pEnd + 0.1);

      // « vos photos » 3.3–4.0 : each source photo gets its check
      tl.to(".f06a-ok", { opacity: 1, scale: 1, duration: 0.24, ease: "expo.out", stagger: 0.11 }, 3.3);
      tl.fromTo(cells, { y: 0 }, { keyframes: [{ y: -8, duration: 0.1 }, { y: 0, duration: 0.16 }], ease: "sine.inOut", stagger: 0.11, immediateRender: false }, 3.3);

      // ══ Scene 3 (3.95–6.0) : one decelerating zoom-out reveals the week ══
      tl.to(cam, { fx: 1600, fy: 562, s: 0.98, duration: 0.85, ease: "expo.out" }, 3.95);
      tl.to("#f06a-photos", { opacity: 0, x: -140, filter: "blur(8px)", duration: 0.3, ease: "power2.in" }, 3.95);
      tl.to("#f06a-post", { opacity: 0, x: 120, y: -30, scale: 0.82, filter: "blur(6px)", duration: 0.28, ease: "power2.in" }, 3.98);
      tl.fromTo("#f06a-cal", { opacity: 0, x: 160, scale: 1.04 }, { opacity: 1, x: 0, scale: 1, duration: 0.5, ease: "expo.out", immediateRender: true }, 4.12);
      tl.fromTo(".f06a-slot", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out", stagger: 0.03, immediateRender: true }, 4.22);

      // subline B on « programmera » (4.53) / « pour vous » (4.94–5.4)
      gsap.set("#f06a-subB", { opacity: 1 });
      tl.to(wa, { opacity: 0, y: -34, filter: "blur(10px)", duration: 0.18, ease: "power2.in", stagger: 0.02 }, 4.2);
      tl.fromTo(wb, { opacity: 0, y: 30, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.3, ease: "expo.out", stagger: 0.04, immediateRender: false }, 4.36);
      [4.42, 4.48, 4.56, 4.96, 5.16].forEach((t, i) => {
        tl.to(wb[i], { color: CREAM, y: -6, duration: 0.14, ease: "power2.out" }, t);
      });

      // entries land one by one, then tick « Programmé ✓ »
      const ENTRY_T = [4.5, 4.8, 5.1, 5.4];
      ["#f06a-e1", "#f06a-e2", "#f06a-e3", "#f06a-e4"].forEach((e, i) => {
        tl.fromTo(e, { opacity: 0, y: -90, scale: 1.04, rotation: i % 2 ? 3 : -3 }, { opacity: 1, y: 0, scale: 1, rotation: 0, duration: 0.35, ease: "expo.out", immediateRender: true }, ENTRY_T[i]);
        tl.fromTo("#f06a-s" + (i + 1), { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.2, ease: "expo.out", immediateRender: true }, ENTRY_T[i] + 0.2);
      });

      // stamp BIENTÔT on the calendar (impact 6.0) + caption
      stamp("#f06a-st", "#f06a-cal", 5.82);
      caption("#f06a-c", 5.92);

      // ══ Scene 4 (6.0–8.9) : headline karaoke ══
      tl.to("#f06a-title", { opacity: 0, y: -40, filter: "blur(10px)", duration: 0.22, ease: "power2.in" }, 5.74);
      tl.to("#f06a-pill", { opacity: 0, y: -30, filter: "blur(8px)", duration: 0.2, ease: "power2.in" }, 5.74);
      const hw = gsap.utils.toArray(".f06a-hw");
      tl.fromTo(hw, { opacity: 0, y: 34, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.3, ease: "expo.out", stagger: 0.03, immediateRender: true }, 5.92);
      // Votre community manager (6.03–7.0) · qui ne prend jamais de pause (7.09–8.68)
      [6.05, 6.28, 6.62, 7.1, 7.24, 7.42, 7.72, 8.08, 8.24].forEach((t, i) => {
        tl.to(hw[i], { color: CREAM, y: -6, duration: 0.14, ease: "power2.out" }, t);
      });

      // initial hidden states for later stamp / caption
      gsap.set(["#f06a-st", "#f06a-c"], { opacity: 0 });

      tl.set({}, {}, DUR);
      window.__timelines["06-agent"] = tl;
    })();
  </script>
