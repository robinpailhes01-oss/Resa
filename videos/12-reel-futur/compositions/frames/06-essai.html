        var g = GLOBAL_START + clock.t;

          var o = s - 45;
          txt = "+0:" + (o < 10 ? "0" + o : o);

          txt = "0:" + (v < 10 ? "0" + v : v);

        if (chipTxt.textContent !== txt) chipTxt.textContent = txt;

      tl.fromTo(clock, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: renderClock, onStart: renderClock }, 0);
