  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      var q = function (s) { return document.querySelectorAll(s); };

      /* ---- countdown: global_start 61.0 → overtime « +0:SS » = floor(61.0 + t) − 45, soft red ---- */
      var cdVals = q("#f07-cd-val span");
      var cdT = [0, 1, 2, 3, 4, 5, 6];
      cdT.forEach(function (t, i) {
        tl.set(cdVals[i], { opacity: 1 }, t);
        if (i < cdT.length - 1) tl.set(cdVals[i], { opacity: 0 }, cdT[i + 1]);
      });
      tl.fromTo("#f07-cd", { scale: 1.18 }, { scale: 1, duration: 0.35, ease: "expo.out" }, 0);
      [1, 2, 3, 4, 5, 6].forEach(function (t) {
        tl.fromTo("#f07-cd", { scale: 1.08 }, { scale: 1, duration: Math.min(0.25, 6.2 - t), ease: "power2.out", immediateRender: false }, t);
      });

      /* emphasis bump on a stressed word */
      function bump(el, t) {
        tl.fromTo(el, { scale: 1 }, { scale: 1.08, duration: 0.1, ease: "power2.out" }, t);
        tl.to(el, { scale: 1, duration: 0.22, ease: "power2.out" }, t + 0.1);
      }

      /* ---- Scene 1 : Céline écrit… ---- */
      tl.fromTo("#f07-avatar", { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "expo.out" }, 0);
      tl.fromTo("#f07-name", { opacity: 0, y: 12 }, { opacity: 0.85, y: 0, duration: 0.3, ease: "power2.out" }, 0.05);
      tl.fromTo("#f07-typing", { scale: 0.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.1, ease: "expo.out" }, 0);
      var dots = q(".f07-dot");
      [0, 1, 2].forEach(function (i) {
        var t0 = 0.0 + i * 0.03;
        tl.fromTo(dots[i], { y: 0 }, { y: -12, duration: 0.05, ease: "sine.out" }, t0);
        tl.to(dots[i], { y: 0, duration: 0.05, ease: "sine.in" }, t0 + 0.05);
      });
      tl.to("#f07-typing", { opacity: 0, scale: 0.85, duration: 0.06, ease: "power2.in" }, 0.11);
      tl.fromTo("#f07-left", { scale: 0.6, opacity: 0, y: 20 }, { scale: 1.03, opacity: 1, y: 0, duration: 0.3, ease: "expo.out" }, 0.14);
      tl.to("#f07-left", { scale: 1, duration: 0.2, ease: "power2.out" }, 0.44);
      var lw = q("#f07-left .f07-w");
      bump(lw[2], 1.02);  /* « vraiment » */
      bump(lw[4], 2.1);   /* « ChatGPT » 2.1–2.95 */

      /* ---- Scene 2 : réponse + tampon BIENTÔT ---- */

      var dots2 = q("#f07-typing2 .f07-dot");
      [0, 1, 2].forEach(function (i) {
        var t0 = 2.92 + i * 0.06;
        tl.fromTo(dots2[i], { y: 0 }, { y: -12, duration: 0.1, ease: "sine.out" }, t0);
        tl.to(dots2[i], { y: 0, duration: 0.1, ease: "sine.in" }, t0 + 0.1);
      });
      tl.to("#f07-typing2", { opacity: 0, scale: 0.85, duration: 0.08, ease: "power2.in" }, 3.14);
      tl.to("#f07-chat", { y: -24, duration: 0.4, ease: "power3.out" }, 3.16);
      tl.fromTo("#f07-right", { scale: 0.6, opacity: 0, y: 30 }, { scale: 1.03, opacity: 1, y: 0, duration: 0.3, ease: "expo.out" }, 3.18);
      tl.to("#f07-right", { scale: 1, duration: 0.2, ease: "power2.out" }, 3.48);
      var rw = q("#f07-right .f07-w");
      bump(rw[0], 3.28);  /* « Bientôt » */
      bump(rw[2], 4.56);  /* « avoue » */
      bump(rw[6], 5.14);  /* « envie » */

      tl.fromTo("#f07-sticker", { opacity: 0, scale: 1.6, rotation: -14 }, { opacity: 1, scale: 1, rotation: -8, duration: 0.18, ease: "power4.in" }, 3.3);
      var hit = [[9, 5], [-7, -4], [4, 2], [-2, -1], [0, 0]];
      hit.forEach(function (p, i) {
        tl.to("#f07-right", { x: p[0], y: p[1], duration: 0.04, ease: "sine.inOut" }, 3.48 + i * 0.04);
      });

      /* ---- Scene 3 : les bulles remontent, logo + CTA, tenue ---- */
      tl.to("#f07-chat", { y: -170, scale: 0.6, duration: 0.6, ease: "power3.inOut" }, 4.28);
      tl.fromTo("#f07-logo", { opacity: 0, y: 50, scale: 0.88, filter: "blur(12px)" }, { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 0.5, ease: "expo.out" }, 4.56);
      tl.fromTo("#f07-cta", { opacity: 0, y: 46, scale: 0.86 }, { opacity: 1, y: 0, scale: 1.04, duration: 0.32, ease: "expo.out" }, 4.62);
      tl.to("#f07-cta", { scale: 1, duration: 0.22, ease: "power2.out" }, 4.94);
      tl.fromTo("#f07-url", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 4.76);
      /* one restrained shine across the button, then everything is still */
      tl.fromTo("#f07-shine", { x: -160, opacity: 1, skewX: -18 }, { x: 700, opacity: 1, skewX: -18, duration: 0.5, ease: "power2.inOut" }, 5.12);

      tl.set({}, {}, 6.2);
      window.__timelines["07-chute"] = tl;
