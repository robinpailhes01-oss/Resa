  <script>
    (function () {
      var ID = "04-bascule";
      var GLOBAL_START = 24.5;
      var DUR = 3.9;
      var CREAM = "#FBF6EA";
      var DIM = "rgba(251, 246, 234, 0.38)";
      var scope = document.querySelector("#root[data-composition-id='" + ID + "']") || document;
      var q = function (s) {
        return scope.querySelector(s);
      };
      var qa = function (s) {
        return Array.prototype.slice.call(scope.querySelectorAll(s));
      };

      // split the reveal words into letters (synchronous, before the timeline is built)
      qa(".f04b-wb").forEach(function (w) {
        var txt = w.textContent;
        w.textContent = "";
        for (var i = 0; i < txt.length; i++) {
          var c = document.createElement("span");
          c.className = "f04b-c";
          c.textContent = txt[i];
          w.appendChild(c);
        }
      });

      var tl = gsap.timeline({ paused: true });

      // ---------- countdown chip (deterministic from local time) ----------
      var chipVal = q("#f04b-chip-val");
      function chipText(tLocal) {
        var g = GLOBAL_START + tLocal;
        var s = Math.floor(g + 1e-6);
        if (g >= 45) {
          var o = s - 45;
          return "+0:" + (o < 10 ? "0" + o : "" + o);
        }
        var v = 45 - s;
        return "0:" + (v < 10 ? "0" + v : "" + v);
      }
      var clock = { t: 0 };
      tl.fromTo(
        clock,
        { t: 0 },
        {
          t: DUR,
          duration: DUR,
          ease: "none",
          onUpdate: function () {
            chipVal.textContent = chipText(clock.t);
          },
        },
        0
      );

      // initial states for one-shot layers
      tl.set("#f04b-night", { opacity: 0 }, 0);
      tl.set(["#f04b-hline", "#f04b-glow", "#f04b-glow2", "#f04b-chip-ring", "#f04b-chip-glow"], { opacity: 0 }, 0);
      tl.set("#f04b-sweep", { x: -1100, skewX: -14, opacity: 0 }, 0);

      // ================= Scene 1 (0.0–1.2) « Mais ce n'est pas tout. » =================
      var wa = qa(".f04b-wa");
      tl.fromTo(wa, { opacity: 0, y: 44, scale: 1.08 }, { opacity: 1, y: 0, scale: 1, duration: 0.3, ease: "expo.out", stagger: 0.035 }, 0);
      [0.1, 0.3, 0.45, 0.69, 0.9].forEach(function (t, i) {
        tl.fromTo(wa[i], { color: DIM }, { color: CREAM, y: -6, duration: 0.14, ease: "power2.out", immediateRender: false }, t);
      });
      tl.fromTo("#f04b-lineA", { scale: 1 }, { scale: 1.04, duration: 1.2, ease: "sine.out" }, 0);
      tl.fromTo("#f04b-halo", { x: -50, opacity: 0.75 }, { x: 30, opacity: 1, duration: 1.2, ease: "sine.inOut" }, 0);

      // ================= Scene 2 (1.2–2.0) blackout, chip alone =================
      // the cut: text gone in 0.12s, lights drop to night
      tl.to("#f04b-lineA", { opacity: 0, scale: 0.97, filter: "blur(8px)", duration: 0.12, ease: "power2.in" }, 1.2);
      tl.to("#f04b-night", { opacity: 1, duration: 0.06, ease: "none" }, 1.22);
      // chip: one pulse on the tick (0:20 → 0:19 at local 1.5)
      tl.fromTo("#f04b-chip", { scale: 1 }, { scale: 1.14, duration: 0.1, ease: "power2.out", immediateRender: false }, 1.5);
      tl.to("#f04b-chip", { scale: 1, duration: 0.42, ease: "expo.out" }, 1.6);
      tl.fromTo("#f04b-chip-ring", { opacity: 0.9, scale: 1 }, { opacity: 0, scale: 1.6, duration: 0.6, ease: "expo.out", immediateRender: false }, 1.5);
      tl.fromTo("#f04b-chip-glow", { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power2.out", immediateRender: false }, 1.5);
      tl.to("#f04b-chip-glow", { opacity: 0.35, duration: 0.6, ease: "power2.out" }, 1.62);
      // tension: a thin horizon line draws out from the centre under the riser
      tl.fromTo("#f04b-hline", { opacity: 0, scaleX: 0 }, { opacity: 0.75, scaleX: 1, duration: 0.68, ease: "power2.in", immediateRender: false }, 1.34);

      // ================= Scene 3 (2.0–3.5) « Et ça… ce n'est que le début. » =================
      // the line blooms into a soft glow
      tl.to("#f04b-hline", { opacity: 0, scaleX: 1.25, scaleY: 8, duration: 0.4, ease: "expo.out" }, 2.02);
      tl.fromTo("#f04b-glow", { opacity: 0, scale: 0.55 }, { opacity: 1, scale: 1, duration: 0.7, ease: "expo.out", immediateRender: false }, 2.02);
      tl.fromTo("#f04b-stage", { scale: 1 }, { scale: 1.045, duration: 1.88, ease: "sine.inOut", immediateRender: false }, 2.02);

      // letters unveil, word by word, out of blur with a cream glow
      var wb = qa(".f04b-wb");
      var wordT = [2.03, 2.18, 2.36, 2.5, 2.72, 2.96, 3.08];
      wb.forEach(function (w, i) {
        var cs = w.querySelectorAll(".f04b-c");
        var big = i >= 5;
        tl.fromTo(
          cs,
          { opacity: 0, y: big ? 34 : 24, scale: big ? 1.18 : 1.1, filter: big ? "blur(18px)" : "blur(12px)" },
          {
            opacity: 1,
            y: 0,
            scale: 1,
            filter: "blur(0px)",
            duration: big ? 0.5 : 0.38,
            ease: "expo.out",
            stagger: big ? 0.035 : 0.022,
          },
          wordT[i]
        );
      });
      // « le début. » lands brighter: a second bloom behind it
      tl.fromTo("#f04b-glow2", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.5, ease: "expo.out", immediateRender: false }, 2.98);
      tl.to("#f04b-glow2", { opacity: 0.7, duration: 0.4, ease: "sine.inOut" }, 3.48);

      // ================= Scene 4 (3.5–3.9) light sweep re-lights the stage =================
      // band and night edge share the same ease/duration → stay locked together
      var SW_T = 3.46;
      var SW_D = 0.44;

      tl.fromTo("#f04b-sweep", { x: -1100, skewX: -14 }, { x: 2300, skewX: -14, duration: SW_D, ease: "power2.inOut", immediateRender: false }, SW_T);

      tl.fromTo(

        { clipPath: "polygon(157.5% 0%, 160% 0%, 160% 100%, 143.5% 100%)", duration: SW_D, ease: "power2.inOut", immediateRender: false },

      tl.to("#f04b-lineC", { scale: 1.02, duration: 0.3, ease: "expo.out" }, 3.58);
