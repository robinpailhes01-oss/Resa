      // kicker + word-by-word masked title, paced to the voice-over

      });

      tl.fromTo("#f05-agenda-copy", { x: 0 }, { x: -8, duration: 4, ease: "none" }, 0);

      // ---------- Scene 2 (1.4–2.6): camera pushes toward Inès's empty 11:00 slot ----------

        "#f05-agenda-canvas",
        { x: -251, y: 0, scale: 0.4476 },
        { x: -1413, y: -351, scale: 0.85, duration: 1.05, ease: "power3.inOut" },

      tl.to("#f05-agenda-win", { z: 66, rotationY: -7, duration: 1.7, ease: "sine.inOut" }, 2.3);

      tl.to("#f05-agenda-slot", { opacity: 0, duration: 0.15, ease: "power2.out" }, LAND - 0.05);

      tl.fromTo(
        "#f05-agenda-block",
        { y: -420, scale: 1.08, opacity: 0 },
        { y: 0, scale: 1, duration: 0.65, ease: "power3.in", immediateRender: true },

      tl.fromTo(
        "#f05-agenda-block",
        { opacity: 0 },
        { opacity: 1, duration: 0.22, ease: "none", immediateRender: false },
        LAND - 0.65,

      tl.fromTo(
        "#f05-agenda-shadow",
        { opacity: 0, scale: 1.25, y: 60, "--f05-sh-blur": "60px" },
        { opacity: 0.5, scale: 1, y: 0, "--f05-sh-blur": "16px", duration: 0.65, ease: "power3.in" },
        LAND - 0.65,
      );
      tl.to("#f05-agenda-shadow", { opacity: 0.32, duration: 0.4, ease: "power2.out" }, LAND);
      // contact: short compression, no bounce
      tl.fromTo(
        "#f05-agenda-block",
        { scaleY: 1 },
        { scaleY: 0.93, duration: 0.07, ease: "power2.out", immediateRender: false },

      );
      tl.to("#f05-agenda-block", { scaleY: 1, duration: 0.35, ease: "power3.out" }, LAND + 0.07);

      tl.fromTo("#f05-agenda-ring", { opacity: 0, scale: 1 }, { opacity: 1, scale: 1.01, duration: 0.07, ease: "none" }, LAND);
      tl.to("#f05-agenda-ring", { opacity: 0, scale: 1.12, duration: 0.6, ease: "power3.out" }, LAND + 0.07);
