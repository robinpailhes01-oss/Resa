  <script>
    (function () {
      var FRAME = "01-accroche";
      var DUR = 4.5;
      window.__timelines = window.__timelines || {};
      var hosts = document.querySelectorAll('[data-composition-id="' + FRAME + '"]');
      var R = hosts[hosts.length - 1];
      var $ = function (s) { return R.querySelector(s); };
      var $$ = function (s) { return Array.prototype.slice.call(R.querySelectorAll(s)); };

      var tl = gsap.timeline({ paused: true });

      // ---------- ghost cards (deterministic field, depth-of-field) ----------
      // [x, y, w, h, z, rotZ, opacity, blur]
      var GHOSTS = [
        [340, 720, 360, 540, -260, -6, 0.13, 10],
        [1100, 600, 440, 300, -520, 3, 0.09, 16],
        [1160, 1060, 380, 560, -300, 7, 0.14, 9],
        [700, 420, 300, 220, -820, -3, 0.08, 22],
        [280, 1540, 520, 340, -180, 4, 0.12, 8],
        [1040, 1780, 500, 320, -200, -5, 0.13, 8],
        [640, 2100, 460, 300, -700, 2, 0.08, 20],
        [780, 1280, 280, 400, -880, 5, 0.1, 22],
        [1220, 2300, 300, 380, -760, -6, 0.09, 20],
        [360, 2260, 330, 440, -620, -4, 0.08, 18]
      ];
      var gWrap = $(".f01-accroche-ghosts");
      gsap.set(gWrap, { rotationX: 24, z: -380, transformOrigin: "50% 50%" });
      var ghostEls = GHOSTS.map(function (g, i) {
        var el = document.createElement("div");
        el.className = "f01-accroche-ghost";
        el.style.left = g[0] + "px";
        el.style.top = g[1] + "px";
        el.style.width = g[2] + "px";
        el.style.height = g[3] + "px";
        el.style.filter = "blur(" + g[7] + "px)";
        var rows = [[12, 38], [26, 62], [40, 50], [54, 70], [68, 44]];
        rows.forEach(function (r, k) {
          if ((i + k) % 4 === 3) return;
          var bar = document.createElement("i");
          bar.style.top = r[0] + "%";
          bar.style.width = r[1] + "%";
          el.appendChild(bar);
        });
        gWrap.appendChild(el);
        gsap.set(el, { z: g[4], rotation: g[5], opacity: g[6] * 0.8 });
        return el;
      });
      // slow parallax drift of the ghost field (deeper = slower)
      ghostEls.forEach(function (el, i) {
        var g = GHOSTS[i];
        var depth = 1 - Math.min(1, -g[4] / 1000);
        tl.fromTo(el, { y: 26 * depth + 8 }, { y: -30 * depth - 6, duration: DUR, ease: "none" }, 0);
      });
      // ghosts settle in from a touch more transparent
      tl.fromTo(gWrap, { opacity: 0.4 }, { opacity: 1, duration: 1.2, ease: "power2.out" }, 0);

      // ---------- background parallax + arcs ----------
      tl.fromTo($(".f01-accroche-bg-inner"), { scale: 1.06, y: 24 }, { scale: 1, y: 0, duration: 1.2, ease: "expo.out" }, 0);
      tl.to($(".f01-accroche-bg-inner"), { scale: 1.07, duration: 0.4, ease: "power3.in" }, 4.1);
      tl.fromTo($(".f01-accroche-arcset"), { rotation: -4 }, { rotation: 3, duration: DUR, ease: "none" }, 0);

      // ---------- camera (Scene 1 straighten → drift → Scene 4 push) ----------
      var world = $(".f01-accroche-world");
      gsap.set(world, { transformOrigin: "540px 1050px" });
      tl.fromTo(world, { rotationX: 16, y: 70, scale: 1.06 }, { rotationX: 0, y: 0, scale: 1, duration: 1.2, ease: "expo.out" }, 0);
      tl.fromTo(world, { z: 0 }, { z: 50, duration: 2.9, ease: "none", immediateRender: false }, 1.2);
      tl.to(world, { z: 560, duration: 0.4, ease: "power3.in" }, 4.1);

      // ---------- kicker « AUJOURD'HUI » (smooth-slice typing) ----------
      var KICK = "Aujourd'hui";
      var kText = $(".f01-accroche-kicker-text");
      var kCaret = $(".f01-accroche-kicker-caret");
      var kLen = { v: 0 };
      tl.fromTo(kLen, { v: 0 }, {
        v: KICK.length, duration: 0.66, ease: "none",
        onUpdate: function () { kText.textContent = KICK.substring(0, Math.floor(kLen.v + 0.0001)); }
      }, 0.12);
      tl.fromTo($$(".f01-accroche-kicker-rule"), { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.8, ease: "expo.out" }, 0.55);
      gsap.set($(".f01-accroche-kicker-rule-l"), { transformOrigin: "100% 50%" });
      gsap.set($(".f01-accroche-kicker-rule-r"), { transformOrigin: "0% 50%" });
      var kBlink = { t: 0 };
      tl.fromTo(kBlink, { t: 0 }, {
        t: DUR, duration: DUR, ease: "none",
        onUpdate: function () {
          var t = kBlink.t, on;
          if (t < 0.06) on = 0;
          else if (t < 0.8) on = 1;
          else if (t < 1.75) on = Math.sin((t - 0.8) * Math.PI * 2 / 0.6 + Math.PI / 2) > 0 ? 1 : 0;
          else on = 0;
          kCaret.style.opacity = on ? "1" : "0";
        }
      }, 0);

      // ---------- headline: word-by-word masked rise (dynamic-content-sequencing) ----------
      var words = $$(".f01-accroche-wi");
      var BASE = 0.1, SEC_PER_CHAR = 0.012, cursor = 0.6;
      var WORD_TL = words.map(function (w) {
        var start = cursor;
        cursor += BASE + w.textContent.length * SEC_PER_CHAR;
        return { el: w, start: start };
      });
      WORD_TL.forEach(function (e) {
        tl.fromTo(e.el, { yPercent: 118, rotation: 4 }, { yPercent: 0, rotation: 0, duration: 0.85, ease: "expo.out" }, e.start);
      });
      tl.fromTo($(".f01-accroche-title"), { y: 18 }, { y: 0, duration: 1.6, ease: "power3.out" }, 0.6);

      // ---------- search bar: slides forward from depth (Scene 3) ----------
      var search = $(".f01-accroche-search");
      gsap.set(search, { transformOrigin: "460px 60px" });
      tl.fromTo(search,
        { z: -1300, y: 40, rotationX: 24, opacity: 0, filter: "blur(16px)" },
        { z: 0, y: 0, rotationX: 12, opacity: 1, filter: "blur(0px)", duration: 1.0, ease: "expo.out" },
        1.6);

      // typed query (discrete-text-sequence: clusters, word pauses, a typo + backspace)
      var SEQ = [
        { t: 0, text: "" },
        { t: 2.0, text: "e" },
        { t: 2.06, text: "est" },
        { t: 2.12, text: "esthé" },
        { t: 2.19, text: "esthéti" },
        { t: 2.25, text: "esthétici" },
        { t: 2.31, text: "esthéticien" },
        { t: 2.37, text: "esthéticienne" },
        { t: 2.52, text: "esthéticienne p" },
        { t: 2.58, text: "esthéticienne prs" },
        { t: 2.74, text: "esthéticienne pr" },
        { t: 2.81, text: "esthéticienne prè" },
        { t: 2.87, text: "esthéticienne près" },
        { t: 2.97, text: "esthéticienne près de" },
        { t: 3.05, text: "esthéticienne près de ch" },
        { t: 3.11, text: "esthéticienne près de chez" },
        { t: 3.19, text: "esthéticienne près de chez m" },
        { t: 3.25, text: "esthéticienne près de chez moi" }
      ];
      function textAt(time) {
        for (var i = SEQ.length - 1; i >= 0; i--) if (time >= SEQ[i].t) return SEQ[i].text;
        return "";
      }
      var qText = $(".f01-accroche-query-text");
      var qCaret = $(".f01-accroche-caret");
      var drv = { t: 0 };
      var lastQ = null;
      tl.fromTo(drv, { t: 0 }, {
        t: DUR, duration: DUR, ease: "none",
        onUpdate: function () {
          var t = drv.t;
          var s = textAt(t);
          if (s !== lastQ) { qText.textContent = s; lastQ = s; }
          // solid while typing, square-wave blink at rest (0.6s cycle)
          var on = (t >= 1.95 && t <= 3.35) ? 1 : (Math.sin(t * Math.PI * 2 / 0.6) > 0 ? 1 : 0);
          if (t < 1.85) on = 0;
          qCaret.style.opacity = on ? "1" : "0";
        }
      }, 0);

      // ---------- suggestions fall in cascade (Scene 4) ----------
      var drop = $(".f01-accroche-drop");
      tl.fromTo(drop,
        { opacity: 0, scaleY: 0.55, y: -14 },
        { opacity: 1, scaleY: 1, y: 0, duration: 0.5, ease: "power3.out" }, 3.0);
      $$(".f01-accroche-row").forEach(function (row, i) {
        tl.fromTo(row,
          { opacity: 0, y: -26, rotationX: -55 },
          { opacity: 1, y: 0, rotationX: 0, duration: 0.55, ease: "expo.out" },
          3.06 + i * 0.16);
      });
      tl.fromTo($(".f01-accroche-row-hl"), { scaleX: 0.15, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.45, ease: "power3.out" }, 3.5);

      // pad timeline to the exact frame length
      tl.set({}, {}, DUR);

      window.__timelines[FRAME] = tl;
    })();
  </script>
