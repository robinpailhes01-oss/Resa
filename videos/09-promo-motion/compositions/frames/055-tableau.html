  <script>
    (function () {
      const R = document.querySelector('[data-composition-id="055-tableau"]');
      const q = (s) => R.querySelector(s);
      const qa = (s) => Array.from(R.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // ---------- geometry (screenshot px → screen), computed, not measured ----------
      const K = 1440 / 2264; // plane scale: card 1440px wide on screen
      const PERSP = 1900,
        PX = 960,
        PY = 560; // .tb55-table perspective + origin
      const OX = 960,
        OY = 883; // plane transform-origin (1132,1040) in table coords
      const TILT = 15; // tilt held during the tile-to-tile journey
      function proj(u, v, deg) {
        const a = (deg * Math.PI) / 180;
        const dx = (u - 1132) * K,
          dy = (v - 1040) * K;
        const y = dy * Math.cos(a),
          z = dy * Math.sin(a);
        const f = PERSP / (PERSP - z);
        return [PX + (OX + dx - PX) * f, PY + (OY + y - PY) * f];
      }
      // tile centres in plane coords: inner offset (12,40) + tile box (38+548i, 62, 520x348)
      const tileC = [0, 1, 2].map((i) => proj(12 + 38 + 548 * i + 260, 40 + 62 + 174, TILT));
      const C = [960, 540];
      const LAND = [960, 585]; // where the active tile lands (clear of the title)
      function aim(i, S) {
        const p = tileC[i];
        return { x: (LAND[0] - C[0]) / S - (p[0] - C[0]), y: (LAND[1] - C[1]) / S - (p[1] - C[1]) };
      }

      // ---------- chart covers over the 30 measured bar columns ----------
      const BARS = [
        [96, 155], [164, 225], [234, 293], [302, 361], [370, 429], [438, 499], [512, 563], [576, 635],
        [644, 703], [712, 773], [782, 841], [850, 909], [918, 977], [990, 1043], [1056, 1115], [1124, 1183],
        [1192, 1253], [1262, 1321], [1330, 1389], [1398, 1457], [1470, 1523], [1536, 1595], [1604, 1663],
        [1672, 1731], [1740, 1801], [1810, 1869], [1878, 1937], [1950, 2001], [2014, 2075], [2084, 2143],
      ];
      const coverHost = q(".tb55-covers");
      const covers = BARS.map((b, i) => {
        const l = i === 0 ? b[0] - 8 : Math.floor((BARS[i - 1][1] + b[0]) / 2);
        const r = i === BARS.length - 1 ? b[1] + 8 : Math.ceil((b[1] + BARS[i + 1][0]) / 2) + 1;
        const d = document.createElement("div");
        d.className = "tb55-cover";
        d.style.left = l + "px";
        d.style.width = r - l + "px";
        coverHost.appendChild(d);
        return d;
      });

      const cam = q(".tb55-cam"),
        pan = q(".tb55-pan"),
        plane = q(".tb55-plane");
      const tiles = [q(".tb55-t0"), q(".tb55-t1"), q(".tb55-t2")];
      const shadows = [q(".tb55-sh0"), q(".tb55-sh1"), q(".tb55-sh2")];
      const rings = [q(".tb55-r0"), q(".tb55-r1"), q(".tb55-r2")];

      // ---------- Scene 1 (0.0–1.4): kicker + title word by word, card rises from depth ----------
      tl.fromTo(
        plane,
        { scale: K, rotationX: 34, z: -520, y: 60, opacity: 0 },
        { scale: K, rotationX: 18, z: 0, y: 0, opacity: 1, duration: 1.3, ease: "power3.out" },
        0,
      );
      tl.fromTo(q(".tb55-ghost"), { scale: 1.1, y: 30 }, { scale: 1.0, y: 0, duration: 6, ease: "none" }, 0);
      tl.fromTo(q(".tb55-kicker"), { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 0.05);
      qa(".tb55-wi").forEach((el, i) => {
        tl.fromTo(el, { yPercent: 115, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.7, ease: "expo.out" }, 0.15 + i * 0.09);
      });
      tl.fromTo(cam, { scale: 0.97 }, { scale: 1, duration: 1.3, ease: "power2.out" }, 0);
      tl.set(shadows.concat(rings, [q(".tb55-halo")]), { opacity: 0 }, 0);

      // ---------- Scene 2 (1.4–4.4): camera travels tile to tile, count-ups on the voice ----------
      const fmt = (n) => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
      const nEl = [q("#f055-tableau-n0"), q("#f055-tableau-n1"), q("#f055-tableau-n2")];
      const suffix = ["", " €", " %"];
      const target = [86, 4230, 78];
      const S = [1.5, 1.72, 1.5];
      const hit = [2.0, 2.8, 3.7]; // « rendez-vous », « revenus », « remplissage »
      const legStart = [1.3, 2.22, 3.12];

      // flatten the tilt a little on the dive
      tl.to(plane, { rotationX: TILT, duration: 0.7, ease: "power3.inOut" }, 1.3);

      for (let i = 0; i < 3; i++) {
        const a = aim(i, S[i]);
        const dur = hit[i] - legStart[i];
        tl.to(cam, { scale: S[i], duration: dur, ease: "power3.inOut" }, legStart[i]);
        tl.to(pan, { x: a.x, y: a.y, duration: dur, ease: "power3.inOut" }, legStart[i]);

        // lift: tile rises, longer shadow, lavender rim
        const up = hit[i] - 0.2;
        const lift = i === 1 ? 1.055 : 1.035;
        tl.fromTo(tiles[i], { scale: 1, y: 0 }, { scale: lift, y: -12, duration: 0.45, ease: "power3.out" }, up);
        tl.fromTo(shadows[i], { opacity: 0, scale: 1, y: 0 }, { opacity: 1, scale: lift, y: -4, duration: 0.45, ease: "power3.out" }, up);
        tl.fromTo(rings[i], { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.out" }, up);

        // deterministic count-up on the captured value
        const o = { v: 0 };
        const el = nEl[i];
        tl.fromTo(
          o,
          { v: 0 },
          {
            v: target[i],
            duration: i === 1 ? 0.85 : 0.65,
            ease: "power2.out",
            onUpdate: () => {
              el.textContent = fmt(o.v) + suffix[i];
            },
          },
          hit[i],
        );

        // settle back as the camera leaves for the next tile
        if (i < 2) {
          const down = legStart[i + 1] + 0.1;
          tl.to(tiles[i], { scale: 1, y: 0, duration: 0.5, ease: "power2.inOut" }, down);
          tl.to(shadows[i], { opacity: 0, scale: 1, y: 0, duration: 0.5, ease: "power2.inOut" }, down);
          tl.to(rings[i], { opacity: 0, duration: 0.4, ease: "power2.inOut" }, down);
        }
      }
      // change chips appear once each count lands
      tl.fromTo(q(".tb55-cm0"), { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.out" }, 2.5);
      tl.fromTo(q(".tb55-cm1"), { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.out" }, 3.5);
      // revenue: the strongest beat — lavender halo under the tile
      tl.fromTo(q(".tb55-halo"), { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.6, ease: "power3.out" }, 2.65);
      tl.to(q(".tb55-halo"), { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 3.25);

      // ---------- Scene 3 (4.4–6.0): pull back to the whole board, bars rise on « coup d'œil » ----------
      tl.to(cam, { scale: 1, duration: 0.95, ease: "power3.inOut" }, 4.2);
      tl.to(pan, { x: 0, y: 0, duration: 0.95, ease: "power3.inOut" }, 4.2);
      tl.to(plane, { rotationX: 11, duration: 1.1, ease: "power3.inOut" }, 4.2);
      tl.to(tiles[2], { scale: 1, y: 0, duration: 0.6, ease: "power2.inOut" }, 4.3);
      tl.to(shadows[2], { opacity: 0, scale: 1, y: 0, duration: 0.6, ease: "power2.inOut" }, 4.3);
      tl.to(rings[2], { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 4.3);
      tl.fromTo(covers, { scaleY: 1 }, { scaleY: 0, duration: 0.5, ease: "power3.out", stagger: 0.024 }, 4.6);
      // underline draws under « coup d'œil. »
      tl.fromTo(q(".tb55-uline"), { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power3.out" }, 4.8);
      // quiet hold drift
      tl.to(cam, { scale: 1.02, duration: 0.85, ease: "sine.inOut" }, 5.15);

      window.__timelines = window.__timelines || {};
      window.__timelines["055-tableau"] = tl;
    })();
  </script>
