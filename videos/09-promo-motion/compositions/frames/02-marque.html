    [id="02-marque-bg"] {

    }

      position: absolute;

    }

    /* ---------- camera ---------- */
    [id="02-marque-scene"] {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }
    [id="02-marque-lens"] {
      position: absolute;
      inset: 0;
      perspective: 1400px;
      perspective-origin: 50% 44%;
    }
    [id="02-marque-world"] {

    /* far layer: luminous arcs */
    [id="02-marque-arcs"] {

      width: 100%;

      overflow: visible;

    [id="02-marque-arcs"] path {
      fill: none;

    /* halo */
    [id="02-marque-halo"] {
      left: 960px;

      border-radius: 50%;
      background: radial-gradient(closest-side, rgba(251, 246, 234, 0.55) 0%, rgba(251, 246, 234, 0.22) 38%, rgba(251, 246, 234, 0.06) 66%, transparent 100%);
    }
    [id="02-marque-halo-core"] {

    /* depth-of-field bokeh */
    .m02-bokeh {
      border-radius: 50%;

    }
    .m02-bokeh.m02-lav {
      background: radial-gradient(closest-side, rgba(182, 166, 216, 0.95), rgba(182, 166, 216, 0) 100%);

    /* lockup */
    [id="02-marque-lockup"] {
      left: 0;

    [id="02-marque-rule"] {
      margin-top: 50px;

    [id="02-marque-tagline"] {
      margin-top: 30px;

      font-weight: 500;
      font-size: 30px;

      letter-spacing: 10.2px;

      text-transform: uppercase;

      color: rgba(251, 246, 234, 0.9);
    }
    [id="02-marque-tagline"] span {
      display: inline-block;
      white-space: pre;
    }

    /* handoff ghost: the search bar from frame 1 passing through the lens */
    [id="02-marque-ghost"] {
      position: absolute;
      left: 960px;
      top: 560px;
      width: 1056px;
      height: 120px;
      margin: -60px 0 0 -528px;
      border-radius: 100px;
      background: #fffdf8;
      border: 1px solid #e7dfd0;
      display: flex;
      align-items: center;
      padding: 0 44px;
      gap: 26px;
      color: #1f2733;
      font-size: 38px;
      font-weight: 500;
      letter-spacing: -0.02em;
    }
    [id="02-marque-ghost"] svg {
      width: 44px;
      height: 44px;
      flex: none;
    }
  </style>

  <div id="root" data-composition-id="02-marque" data-start="0" data-duration="2.5" data-width="1920" data-height="1080">
    <!-- ground -->
    <div id="02-marque-bg" class="clip" data-start="0" data-duration="2.5" data-track-index="0">
      <div id="02-marque-grid"></div>
      <div id="02-marque-vignette"></div>
    </div>

    <!-- scene -->
    <div id="02-marque-scene" class="clip" data-start="0" data-duration="2.5" data-track-index="1">
      <div id="02-marque-lens">
        <div id="02-marque-world">
          <div id="02-marque-arcs">
            <svg viewBox="0 0 2440 1680" aria-hidden="true">
              <path id="02-marque-arc-a" d="M 140 1500 A 1180 1180 0 0 1 2300 1500" stroke-width="1.5" opacity="0.25" />
              <path id="02-marque-arc-b" d="M 420 1560 A 860 860 0 0 1 2020 1560" stroke-width="1.2" opacity="0.18" />
              <path id="02-marque-arc-c" d="M -60 380 A 1600 1600 0 0 0 2500 380" stroke-width="1" opacity="0.14" />
            </svg>
          </div>

          <div id="02-marque-halo"></div>
          <div id="02-marque-halo-core"></div>

          <div class="m02-bokeh" id="02-marque-b1" style="left:250px;top:180px;width:150px;height:150px"></div>
          <div class="m02-bokeh" id="02-marque-b2" style="left:1560px;top:250px;width:90px;height:90px"></div>
          <div class="m02-bokeh m02-lav" id="02-marque-b3" style="left:1450px;top:640px;width:210px;height:210px"></div>
          <div class="m02-bokeh" id="02-marque-b4" style="left:380px;top:690px;width:70px;height:70px"></div>
          <div class="m02-bokeh" id="02-marque-b5" style="left:1700px;top:120px;width:260px;height:260px"></div>
          <div class="m02-bokeh" id="02-marque-b6" style="left:-40px;top:520px;width:300px;height:300px"></div>

          <div id="02-marque-lockup">
            <div id="02-marque-logo-mask">
              <img id="02-marque-logo" src="assets/logo-reso-creme.svg" alt="reso" />
              <div id="02-marque-sheen"></div>
            </div>
            <div id="02-marque-rule"></div>
            <div id="02-marque-tagline">Beauty business simplified</div>
          </div>
        </div>
      </div>

      <div id="02-marque-ghost">
        <svg viewBox="0 0 24 24" fill="none" stroke="#4A6179" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
          <circle cx="10.5" cy="10.5" r="6.5" />
          <path d="M15.5 15.5 L21 21" />
        </svg>
        <span>esthéticienne près de chez moi</span>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const $ = (id) => document.getElementById("02-marque-" + id);
      const tl = gsap.timeline({ paused: true });

      const world = $("world");
      const lens = $("lens");
      const ghost = $("ghost");
      const halo = $("halo");
      const haloCore = $("halo-core");
      const lockup = $("lockup");
      const logoMask = $("logo-mask");
      const logo = $("logo");
      const sheen = $("sheen");
      const rule = $("rule");
      const tagline = $("tagline");
      const arcs = ["arc-a", "arc-b", "arc-c"].map($);

      // depth placement (parallax under the camera move)
      gsap.set($("arcs"), { z: -520 });
      gsap.set([halo, haloCore], { z: -160 });
      gsap.set($("b1"), { z: 260, filter: "blur(14px)", opacity: 0.3 });
      gsap.set($("b2"), { z: -300, filter: "blur(6px)", opacity: 0.32 });
      gsap.set($("b3"), { z: 180, filter: "blur(22px)", opacity: 0.3 });
      gsap.set($("b4"), { z: -120, filter: "blur(4px)", opacity: 0.36 });
      gsap.set($("b5"), { z: 420, filter: "blur(30px)", opacity: 0.22 });
      gsap.set($("b6"), { z: 360, filter: "blur(28px)", opacity: 0.2 });

      // arcs: stroke draw prep
      arcs.forEach((p) => {
        const len = p.getTotalLength();
        p.style.strokeDasharray = len + " " + len;
        p.dataset.len = len;
      });

      /* ---------- Scene 1 (0.0–0.5): end of the zoom-through ---------- */
      // handoff_in: the search bar arrives huge + blurred at center and passes through the lens
      tl.fromTo(
        ghost,
        { scale: 3, opacity: 0.9, filter: "blur(16px)" },
        { scale: 7.5, opacity: 0, filter: "blur(34px)", duration: 0.32, ease: "power2.in" },
        0
      );

      // camera arrives from the push: depth-wise streak (B B) that resolves sharp
      tl.fromTo(
        lens,
        { filter: "blur(18px)" },
        { filter: "blur(0px)", duration: 0.7, ease: "expo.out" },
        0
      );
      tl.fromTo(
        world,
        { scale: 1.35, rotationX: 9, z: 0 },
        { scale: 1.0, rotationX: 0, duration: 1.2, ease: "expo.out" },
        0
      );
      // near-imperceptible push through the hold (life in the still)
      tl.to(world, { scale: 1.03, duration: 1.3, ease: "power1.inOut" }, 1.2);

      // soft cream halo opens at center
      tl.fromTo(halo, { scale: 0.45, opacity: 0 }, { scale: 1, opacity: 0.9, duration: 1.0, ease: "power3.out" }, 0.05);
      tl.fromTo(haloCore, { scaleX: 0.3, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.9, ease: "power3.out" }, 0.25);

      // luminous arcs trace in the far plane
      arcs.forEach((p, i) => {
        const len = Number(p.dataset.len);
        tl.fromTo(
          p,
          { strokeDashoffset: len },
          { strokeDashoffset: 0, duration: 1.5, ease: "power3.inOut" },
          0.1 + i * 0.12
        );
      });

      /* ---------- Scene 2 (0.4–1.4): reso® unveiled by a left→right mask ---------- */
      tl.fromTo(
        logoMask,
        { clipPath: "inset(-80px 100% -160px -120px)" },
        { clipPath: "inset(-80px -120px -160px -120px)", duration: 0.95, ease: "power3.inOut" },
        0.4
      );
      tl.fromTo(
        logo,
        { y: 26, opacity: 0, filter: "blur(12px) drop-shadow(0 18px 40px rgba(31,39,51,0.28))" },
        { y: 0, opacity: 1, filter: "blur(0px) drop-shadow(0 18px 40px rgba(31,39,51,0.28))", duration: 1.0, ease: "expo.out" },
        0.4
      );
      // light sheen riding the mask's leading edge
      tl.fromTo(sheen, { x: 0, opacity: 0 }, { x: 540, duration: 0.95, ease: "power3.inOut" }, 0.4);
      tl.to(sheen, { opacity: 0.7, duration: 0.25, ease: "power2.out" }, 0.45);
      tl.to(sheen, { opacity: 0, duration: 0.3, ease: "power2.in" }, 1.08);
      // lockup settles in depth
      tl.fromTo(
        lockup,
        { z: -140, rotationX: 6 },
        { z: 0, rotationX: 0, duration: 1.4, ease: "expo.out" },
        0.4
      );

      /* ---------- Scene 3 (1.1–2.5): rule traces, tagline tightens, hold ---------- */
      tl.fromTo(
        rule,
        { scaleX: 0, opacity: 0 },
        { scaleX: 1, opacity: 0.85, duration: 0.55, ease: "power3.inOut" },
        1.15
      );
      // tagline: wide tracking that tightens — per-glyph x spread (transform-only, sub-pixel smooth)
      const chars = Array.from(tagline.textContent);
      tagline.textContent = "";
      const glyphs = chars.map((c) => {
        const sp = document.createElement("span");
        sp.textContent = c;
        tagline.appendChild(sp);
        return sp;
      });
      const mid = (glyphs.length - 1) / 2;
      const SPREAD = 16; // extra px of tracking per glyph at the start
      glyphs.forEach((g, i) => {
        tl.fromTo(
          g,
          { x: (i - mid) * SPREAD },
          { x: 0, duration: 0.9, ease: "expo.out" },
          1.4
        );
      });
      tl.fromTo(
        tagline,
        { opacity: 0, filter: "blur(8px)", y: 8 },
        { opacity: 1, filter: "blur(0px)", y: 0, duration: 0.8, ease: "expo.out" },
        1.4
      );

      // anchor the timeline length to the frame duration
      tl.set({}, {}, 2.5);

      window.__timelines = window.__timelines || {};
      window.__timelines["02-marque"] = tl;
    })();
  </script>
</template>
