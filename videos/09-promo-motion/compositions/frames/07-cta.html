  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Click target: visual centre of the button (690 + 270, 548 + 64)
      const CLICK_X = 960;
      const CLICK_Y = 612;

      // ── Camera: a single settling push-in on the stage (expo, no drift after) ──
      tl.fromTo("#cta07-world", { scale: 1.06, y: 18 }, { scale: 1, y: 0, duration: 2.4, ease: "expo.out" }, 0);

      // ── Scene 1 (0.0–1.4): blurred tablet in depth + title word by word ──
      tl.fromTo(
        "#cta07-tablet-rig",
        { opacity: 0, z: -260, x: 60 },
        { opacity: 1, z: 0, x: 0, duration: 1.6, ease: "expo.out" },
        0,
      );
      tl.fromTo("#cta07-tablet-ghost", { opacity: 0 }, { opacity: 1, duration: 1.2, ease: "power2.out" }, 0.1);

      tl.fromTo(
        "#cta07-title .cta07-word",
        { yPercent: 110, opacity: 0, filter: "blur(10px)" },
        { yPercent: 0, opacity: 1, filter: "blur(0px)", duration: 0.95, ease: "power3.out", stagger: 0.18 },
        0.12,
      );

      // ── Scene 2 (1.2–2.6): offer line, then cream pill with lavender bloom ──
      tl.fromTo(
        "#cta07-offer",
        { y: 22, opacity: 0, filter: "blur(6px)" },
        { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.8, ease: "power3.out" },
        1.2,
      );
      tl.fromTo(
        "#cta07-btn",
        { y: 46, scale: 0.9, opacity: 0 },
        { y: 0, scale: 1, opacity: 1, duration: 0.9, ease: "expo.out" },
        1.6,
      );
      // ambient-glow-bloom: lands on the button's settle (1.5 + 1.0 ≈ 2.5)
      tl.fromTo(
        "#cta07-btn-glow",
        { opacity: 0, scale: 0.82 },
        { opacity: 0.3, scale: 1, duration: 1.0, ease: "power2.out" },
        1.5,
      );

      // ── Scene 3 (2.4–3.3): cursor enters, clicks; press + ripple ──
      const MOVE_START = 2.3;
      const MOVE_DUR = 0.5;
      const CLICK_AT = 2.88;
      tl.fromTo(
        "#cta07-cursor",
        { x: 1360, y: 860, opacity: 0 },
        { x: CLICK_X + 6, y: CLICK_Y + 4, opacity: 1, duration: MOVE_DUR, ease: "power3.out" },
        MOVE_START,
      );
      // cursor depress + return (two adjacent tweens, no yoyo)
      tl.to("#cta07-cursor", { scale: 0.84, duration: 0.08, ease: "power2.in" }, CLICK_AT);
      tl.to("#cta07-cursor", { scale: 1, duration: 0.14, ease: "power2.out" }, CLICK_AT + 0.08);
      // press-release: linear-ish press, smooth release (house rule: no bounce)
      tl.to(
        "#cta07-btn",
        { scale: 0.93, boxShadow: "0 14px 30px -16px rgba(31,39,51,0.55)", duration: 0.1, ease: "power1.in" },
        CLICK_AT,
      );
      tl.to(
        "#cta07-btn",
        { scale: 1, boxShadow: "0 40px 80px -30px rgba(31,39,51,0.55)", duration: 0.42, ease: "expo.out" },
        CLICK_AT + 0.1,
      );
      // burst behind the button on release
      tl.fromTo(
        "#cta07-btn-burst",
        { opacity: 0, scale: 1 },
        { opacity: 0.85, scale: 1.7, duration: 0.3, ease: "power2.out" },
        CLICK_AT + 0.1,
      );
      tl.to("#cta07-btn-burst", { opacity: 0, duration: 0.3, ease: "power2.in" }, CLICK_AT + 0.4);
      tl.to("#cta07-btn-glow", { opacity: 0.42, scale: 1.06, duration: 0.3, ease: "power2.out" }, CLICK_AT + 0.1);
      // cursor-click-ripple: two lavender rings from the click point
      tl.fromTo(
        ["#cta07-ripple-1", "#cta07-ripple-2"],
        { scale: 0.3, opacity: 0.95 },
        { scale: 4.6, opacity: 0, duration: 0.62, ease: "power2.out", stagger: 0.09, immediateRender: false },
        CLICK_AT + 0.02,
      );

      // ── Scene 4 (3.3–5.5): scale-swap to the signature, then held still ──
      const TRIGGER = 3.3;
      const EXIT_DUR = 0.4;
      tl.to(
        "#cta07-stack",
        { scale: 0.74, opacity: 0, filter: "blur(10px)", duration: EXIT_DUR, ease: "power2.in" },
        TRIGGER,
      );
      tl.to("#cta07-tablet-rig", { opacity: 0.22, z: -220, duration: 0.9, ease: "power2.inOut" }, TRIGGER);
      tl.to("#cta07-tablet-ghost", { opacity: 0.4, duration: 0.9, ease: "power2.inOut" }, TRIGGER);

      const ENTER_AT = TRIGGER + EXIT_DUR - 0.25; // 3.45 — on the sonic logo
      tl.fromTo(
        "#cta07-logo",
        { scale: 0.78, opacity: 0, filter: "blur(14px)" },
        { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.95, ease: "expo.out" },
        ENTER_AT,
      );
      tl.fromTo(
        "#cta07-sig-glow",
        { opacity: 0, scale: 0.85 },
        { opacity: 0.22, scale: 1, duration: 1.0, ease: "power2.out" },
        ENTER_AT,
      );
      tl.fromTo(
        "#cta07-rule",
        { scaleX: 0, opacity: 0 },
        { scaleX: 1, opacity: 1, duration: 0.7, ease: "expo.out" },
        3.78,
      );
      tl.fromTo(
        "#cta07-tagline",
        { opacity: 0, y: 12, filter: "blur(6px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.8, ease: "power3.out" },
        3.9,
      );
      tl.fromTo(
        "#cta07-price",
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" },
        4.15,
      );
      // hold, still, to the last frame
      tl.set({}, {}, 5.5);

      window.__timelines["07-cta"] = tl;
    })();
  </script>
