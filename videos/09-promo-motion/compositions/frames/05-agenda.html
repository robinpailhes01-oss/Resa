  <script>
    (function () {
      const FID = "05-agenda";
      const root = document.querySelector('[data-composition-id="' + FID + '"]');
      const q = (sel) => root.querySelector(sel);
      const qa = (sel) => root.querySelectorAll(sel);

      const world = q("#a05-world");
      const tl = gsap.timeline({ paused: true });

      // ---- one camera state, one writer (viewport-change) ----
      const cam = { x: 560, y: 10, scale: 0.92, blur: 7 };
      function applyCamera() {
        world.style.transform = "translate(" + cam.x + "px," + cam.y + "px) scale(" + cam.scale + ")";
        world.style.filter = cam.blur > 0.05 ? "blur(" + cam.blur.toFixed(2) + "px)" : "none";
      }
      applyCamera();

      // Scene 1 (0.0–1.4): lateral travelling right→left that settles + slight push
      tl.to(cam, { x: 0, y: 0, scale: 1, duration: 1.4, ease: "power3.out", onUpdate: applyCamera }, 0);
      tl.to(cam, { blur: 0, duration: 0.8, ease: "power2.out", onUpdate: applyCamera }, 0);
      // breathing drift on the hold (never dies)
      tl.to(cam, { x: -18, scale: 1.03, duration: 2.6, ease: "sine.inOut", onUpdate: applyCamera }, 1.4);

      // background parallax (slower plane)
      tl.fromTo("#a05-arcs", { x: 220 }, { x: -20, duration: 4, ease: "power3.out" }, 0);
      tl.fromTo("#a05-grid", { x: 90 }, { x: 0, duration: 1.6, ease: "power3.out" }, 0);

      // phone tilt resolves with the camera, then near-imperceptible drift
      tl.fromTo(
        "#a05-rig",
        { rotationY: -30, rotationX: 8, rotationZ: 1.5 },
        { rotationY: -13, rotationX: 5, rotationZ: 0.5, duration: 1.4, ease: "power3.out" },
        0,
      );
      tl.to("#a05-rig", { rotationY: -10, rotationX: 4, duration: 2.6, ease: "sine.inOut" }, 1.4);

      // kicker + word-by-word masked title
      tl.fromTo("#a05-kicker", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 0.2);
      tl.fromTo(
        qa(".a05-w"),
        { yPercent: 140 },
        { yPercent: 0, duration: 0.75, ease: "expo.out", stagger: 0.09 },
        0.3,
      );

      // Scene 2 (1.4–2.8): empty slot lights up, booking block drops into it
      tl.fromTo("#a05-slotglow", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.out" }, 1.25);
      tl.to("#a05-slotglow", { opacity: 0, duration: 0.2, ease: "power2.out" }, 2.22);

      const LAND = 2.25;
      tl.fromTo(
        "#a05-block",
        { y: -330, z: 240, rotationX: 22, opacity: 0 },
        { y: 0, z: 0, rotationX: 0, duration: 0.8, ease: "power3.inOut", immediateRender: true },
        1.45,
      );
      tl.fromTo("#a05-block", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "none", immediateRender: false }, 1.45);
      tl.fromTo(
        "#a05-shadow",
        { opacity: 0, scale: 1.35, "--a05-sh-blur": "34px", y: 30 },
        { opacity: 0.42, scale: 1, "--a05-sh-blur": "7px", y: 0, duration: 0.8, ease: "power3.inOut" },
        1.45,
      );
      // landing accent (the "ding"): soft lavender ring expands and dissolves
      tl.fromTo(
        "#a05-ring",
        { opacity: 0, scale: 1 },
        { opacity: 0.9, scale: 1.02, duration: 0.08, ease: "none" },
        LAND,
      );
      tl.to("#a05-ring", { opacity: 0, scale: 1.14, duration: 0.55, ease: "power3.out" }, LAND + 0.08);
      // small settle on contact (compression, no bounce)
      tl.fromTo(
        "#a05-block",
        { scaleY: 1 },
        { scaleY: 0.96, duration: 0.08, ease: "power2.out", immediateRender: false },
        LAND,
      );
      tl.to("#a05-block", { scaleY: 1, duration: 0.35, ease: "power3.out" }, LAND + 0.08);

      // Scene 3 (2.8–4.0): notification slides over the phone and rests
      tl.fromTo(
        "#a05-notif",
        { y: -110, z: 60, opacity: 0, filter: "blur(10px)" },
        { y: 0, z: 90, opacity: 1, filter: "blur(0px)", duration: 0.7, ease: "expo.out" },
        2.85,
      );
      tl.to("#a05-notif", { y: 6, duration: 0.45, ease: "sine.inOut" }, 3.55);

      tl.set({}, {}, 4);

      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
  </script>
