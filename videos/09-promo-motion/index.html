<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #FBF6EA;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="30"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="el-01-accroche"
        class="scene"
        data-composition-id="01-accroche"
        data-composition-src="compositions/frames/01-accroche.html"
        data-start="0"
        data-duration="4.9"
        data-track-index="0"
      ></div>

      <div
        id="el-02-marque"
        class="scene"
        data-composition-id="02-marque"
        data-composition-src="compositions/frames/02-marque.html"
        data-start="4.5"
        data-duration="3"
        data-track-index="1"
      ></div>

      <div
        id="el-03-page"
        class="scene"
        data-composition-id="03-page"
        data-composition-src="compositions/frames/03-page.html"
        data-start="7"
        data-duration="5"
        data-track-index="0"
      ></div>

      <div
        id="el-04-creneau"
        class="scene"
        data-composition-id="04-creneau"
        data-composition-src="compositions/frames/04-creneau.html"
        data-start="11.5"
        data-duration="5"
        data-track-index="1"
      ></div>

      <div
        id="el-05-agenda"
        class="scene"
        data-composition-id="05-agenda"
        data-composition-src="compositions/frames/05-agenda.html"
        data-start="16"
        data-duration="4.5"
        data-track-index="0"
      ></div>

      <div
        id="el-06-emails"
        class="scene"
        data-composition-id="06-emails"
        data-composition-src="compositions/frames/06-emails.html"
        data-start="20"
        data-duration="5"
        data-track-index="1"
      ></div>

      <div
        id="el-07-cta"
        class="scene"
        data-composition-id="07-cta"
        data-composition-src="compositions/frames/07-cta.html"
        data-start="24.5"
        data-duration="5.5"
        data-track-index="0"
      ></div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-accroche", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 4.5);
        tl.fromTo("#el-02-marque", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 4.5);
        tl.to("#el-02-marque", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 7);
        tl.fromTo("#el-03-page", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 7);
        tl.to("#el-03-page", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 11.5);
        tl.fromTo("#el-04-creneau", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 11.5);
        tl.to("#el-04-creneau", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 16);
        tl.fromTo("#el-05-agenda", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 16);
        tl.to("#el-05-agenda", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 20);
        tl.fromTo("#el-06-emails", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 20);
        tl.to("#el-06-emails", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 24.5);
        tl.fromTo("#el-07-cta", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 24.5);
        tl.to({}, { duration: 30 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
