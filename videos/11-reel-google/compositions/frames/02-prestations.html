      const R = document.querySelector('[data-composition-id="02-prestations"]');

      const tl = gsap.timeline({ paused: true });

      // Checkbox centres (px, frame coords) — fixed layout heights
      // rows start at y=530, pitch 124, checkbox centre offset 56; x = 181

        { x: 181, y: 586 },
        { x: 181, y: 710 },
        { x: 181, y: 834 },

      const BTN = { x: 360, y: 1218 };
      const CHECK_T = [0.9, 1.22, 1.54];
      const CLICK_T = 1.96;

      // ---- Scene 1 (0.0–0.5): label + list card arrives on its stone plinth

      tl.fromTo(q("#f02-label-rule"), { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "expo.out" }, 0.1);
      tl.fromTo(q("#f02-label-txt"), { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 0.16);

        q("#f02-socle"),
        { opacity: 0, y: 90, scale: 0.965, rotationX: 7 },
        { opacity: 1, y: 0, scale: 1, rotationX: 0, duration: 0.75, ease: "expo.out" },

      tl.fromTo(q("#f02-sub"), { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.18);
      ["#f02-row1", "#f02-row2", "#f02-row3", "#f02-row4", "#f02-row5"].forEach((id, i) => {
        const dim = i >= 3 ? 0.6 : 1;
        tl.fromTo(q(id), { opacity: 0, y: 26 }, { opacity: dim, y: 0, duration: 0.5, ease: "power3.out" }, 0.22 + i * 0.055);
      });
      tl.fromTo(q("#f02-btn"), { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.5);
      tl.set(q("#f02-hours"), { opacity: 0 }, 0);

      // slow camera push under the whole shot

      // ---- cursor path (cream body, ink tip)
      const cur = q("#f02-cursor");
      const rip = q("#f02-ripple");
      tl.set(rip, { opacity: 0, scale: 0.3 }, 0);
      tl.fromTo(cur, { x: 470, y: 900, opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, 0.5);
      tl.fromTo(cur, { x: 470, y: 900 }, { x: BOX[0].x, y: BOX[0].y, duration: 0.36, ease: "power3.inOut", immediateRender: false }, 0.5);

      // ---- Scene 2 (0.4–1.9): three ticks land, one by one
      CHECK_T.forEach((t, i) => {
        const n = i + 1;
        if (i > 0) {
          tl.to(cur, { x: BOX[i].x, y: BOX[i].y, duration: 0.2, ease: "power3.inOut" }, t - 0.24);
        }
        // press
        tl.to(cur, { scale: 0.86, duration: 0.06, ease: "power2.out" }, t - 0.03);
        tl.to(cur, { scale: 1, duration: 0.16, ease: "power2.out" }, t + 0.04);
        tl.fromTo(rip, { opacity: 0.9, scale: 0.3 }, { opacity: 0, scale: 1.25, duration: 0.4, ease: "power2.out", immediateRender: false }, t);
        // row lights up
        tl.fromTo(
          q("#f02-row" + n),
          { backgroundColor: "#FFFDF8", borderColor: "#E7DFD0" },
          { backgroundColor: "#EEF2F6", borderColor: "#4A6179", duration: 0.22, ease: "power2.out", immediateRender: false },
          t,
        );
        tl.fromTo(
          q("#f02-box" + n),
          { backgroundColor: "#FFFDF8", borderColor: "#8B929D" },
          { backgroundColor: "#4A6179", borderColor: "#4A6179", duration: 0.14, ease: "power2.out", immediateRender: false },
          t,
        );
        tl.fromTo(q("#f02-box" + n), { scale: 0.82 }, { scale: 1, duration: 0.3, ease: "power3.out", immediateRender: false }, t);
        tl.fromTo(q("#f02-chk" + n), { strokeDashoffset: 30 }, { strokeDashoffset: 0, duration: 0.24, ease: "power2.out", immediateRender: false }, t + 0.04);
      });

      // ---- Scene 3 (1.8–2.6): click "Ajouter les prestations cochées" → Horaires on "disponibilités"
      tl.to(cur, { x: BTN.x, y: BTN.y, duration: 0.3, ease: "power3.inOut" }, CLICK_T - 0.34);
      tl.to(cur, { scale: 0.86, duration: 0.06, ease: "power2.out" }, CLICK_T - 0.03);
      tl.to(cur, { scale: 1, duration: 0.16, ease: "power2.out" }, CLICK_T + 0.04);
      tl.fromTo(rip, { opacity: 0.9, scale: 0.3 }, { opacity: 0, scale: 1.4, duration: 0.45, ease: "power2.out", immediateRender: false }, CLICK_T);
      tl.fromTo(q("#f02-btn"), { scale: 1 }, { scale: 0.965, duration: 0.07, ease: "power2.out", immediateRender: false }, CLICK_T - 0.02);
      tl.to(q("#f02-btn"), { scale: 1, duration: 0.25, ease: "power3.out" }, CLICK_T + 0.06);
      tl.to(q("#f02-btn"), { backgroundColor: "#4A6179", duration: 0.18, ease: "power2.out" }, CLICK_T);
      tl.fromTo(
        q("#f02-hours"),
        { opacity: 0, y: 20, clipPath: "inset(0% 100% 0% 0% round 22px)" },
        { opacity: 1, y: 0, clipPath: "inset(0% 0% 0% 0% round 22px)", duration: 0.5, ease: "expo.out", immediateRender: false },
        2.08,
      );
      tl.fromTo(q("#f02-hours-ico"), { scale: 0.6 }, { scale: 1, duration: 0.4, ease: "power3.out" }, 2.12);
      tl.to(cur, { opacity: 0, duration: 0.22, ease: "power2.in" }, 2.3);

      // ---- Scene 4 (2.5–3.6): list card recedes + pivots; real Équipe cards glide in front
      tl.to(
        q("#f02-socle"),
        { scale: 0.86, y: -26, rotationX: 9, rotationY: -7, duration: 0.95, ease: "power3.inOut" },
        2.48,
      );
      tl.to(q("#f02-socle"), { opacity: 0.82, duration: 0.8, ease: "power2.out" }, 2.6);
      tl.fromTo(
        q("#f02-team"),
        { y: 420, scale: 0.9, rotationX: 22, rotationY: 0, rotation: 0 },
        { y: 0, scale: 1, rotationX: 5, rotationY: 7, rotation: -1.6, duration: 0.85, ease: "expo.out" },
        2.58,
      );
      tl.fromTo(q("#f02-team"), { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "power1.out" }, 2.58);
      tl.fromTo(q("#f02-m1"), { y: 40 }, { y: 0, duration: 0.6, ease: "power3.out" }, 2.6);
      tl.fromTo(q("#f02-m2"), { y: 70 }, { y: 0, duration: 0.7, ease: "power3.out" }, 2.6);
      tl.fromTo(q("#f02-sheen-bar"), { x: -300 }, { x: 1000, duration: 0.6, ease: "power2.inOut" }, 2.95);
      // hold: quiet settle
      tl.to(q("#f02-team"), { y: -8, rotationY: 5, duration: 0.17, ease: "power1.out" }, 3.43);

      window.__timelines = window.__timelines || {};
      window.__timelines["02-prestations"] = tl;
