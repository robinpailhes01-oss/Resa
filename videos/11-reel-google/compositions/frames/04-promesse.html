<template id="04-promesse-template">
  <style>
    @font-face {
      font-family: "Outfit";
      src: url("assets/fonts/outfit.woff2") format("woff2");
      font-weight: 100 900;
      font-style: normal;
    }
    @font-face {
      font-family: "Manrope";
      src: url("assets/fonts/manrope.woff2") format("woff2");
      font-weight: 200 800;
      font-style: normal;
    }
    @font-face {
      font-family: "JetBrains Mono";
      src: url("assets/fonts/jetbrainsmono.woff2") format("woff2");
      font-weight: 100 800;
      font-style: normal;
    }

    #root {
      position: absolute;
      inset: 0;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      font-family: "Outfit", sans-serif;
      color: #1f2733;
    }

    /* ---------- ground: ivory + soft radial + static grain ---------- */
    #f04-ground {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: radial-gradient(ellipse 85% 60% at 50% 44%, #fbf6ea 0%, #f9f3e6 52%, #f4eddf 100%);
    }
    #f04-grain {
      position: absolute;
      inset: 0;
      width: 1080px;
      height: 1920px;
      opacity: 0.045;
      mix-blend-mode: multiply;
    }

    /* ---------- ghost of the previous frame's phone (depth, receding) ---------- */
    #f04-ghost {
      position: absolute;
      left: 240px;
      top: 470px;
      width: 600px;
      height: 1230px;
      border-radius: 64px;
      background: linear-gradient(160deg, #f5f3ef 0%, #c9c6c0 45%, #8e8b86 75%, #c9c6c0 100%);
      padding: 14px;
      transform-origin: 50% 40%;
    }
    #f04-ghost-screen {
      width: 100%;
      height: 100%;
      border-radius: 50px;
      background: linear-gradient(180deg, #fffdf8 0%, #f4eddf 55%, #e7f2ec 100%);
    }

    /* ---------- notification: the real email Reso sends the pro ---------- */
    #f04-notif {
      position: absolute;
      left: 72px;
      top: 300px;
      width: 936px;
      transform-origin: 50% 0%;
    }
    #f04-notif-card {
      position: relative;
      display: flex;
      align-items: flex-start;
      gap: 30px;
      padding: 36px 40px 38px 36px;
      border-radius: 44px;
      background: rgba(255, 253, 248, 0.96);
      border: 1.5px solid #e7dfd0;
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.9) inset,
        0 40px 80px -28px rgba(31, 39, 51, 0.22),
        0 8px 24px -10px rgba(31, 39, 51, 0.1);
    }
    #f04-notif-icon {
      flex: 0 0 auto;
      width: 104px;
      height: 104px;
      border-radius: 28px;
      background: linear-gradient(160deg, #536b84 0%, #4a6179 55%, #3e5166 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 22px -10px rgba(62, 81, 102, 0.7);
    }
    #f04-notif-icon svg {
      width: 52px;
      height: 52px;
    }
    #f04-notif-body {
      flex: 1 1 auto;
      min-width: 0;
      padding-top: 2px;
    }
    #f04-notif-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: "Manrope", sans-serif;
      font-weight: 600;
      font-size: 25px;
      line-height: 1.2;
      color: #5f6672;
      margin-bottom: 12px;
    }
    #f04-notif-meta .f04-dot {
      padding: 0 0.3em;
      color: #5f6672;
    }
    #f04-notif-unread {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #4a6179;
    }
    #f04-notif-title {
      font-family: "Manrope", sans-serif;
      font-weight: 700;
      font-size: 34px;
      line-height: 1.26;
      letter-spacing: -0.01em;
      color: #1f2733;
    }
    #f04-notif-line {
      margin-top: 12px;
      font-family: "Manrope", sans-serif;
      font-weight: 500;
      font-size: 28px;
      line-height: 1.3;
      color: #5f6672;
    }

    /* ---------- the promise ---------- */
    #f04-promise {
      position: absolute;
      inset: 0;
      transform-origin: 540px 860px;
    }
    #f04-title {
      position: absolute;
      left: 72px;
      right: 72px;
      top: 696px;
      text-align: center;
      font-family: "Outfit", sans-serif;
      font-weight: 500;
      font-size: 94px;
      line-height: 1.06;
      letter-spacing: -0.03em;
      color: #1f2733;
    }
    .f04-line {
      display: block;
      white-space: nowrap;
    }
    .f04-mask {
      display: inline-block;
      overflow: hidden;
      vertical-align: top;
      padding: 0 0.02em 0.14em;
      margin: 0 0.1em -0.14em;
    }
    .f04-word {
      display: inline-block;
    }
    #f04-rule {
      position: absolute;
      left: 512px;
      top: 1066px;
      width: 56px;
      height: 2px;
      border-radius: 2px;
      background: #4a6179;
      transform-origin: 50% 50%;
    }
    #f04-offer {
      position: absolute;
      left: 0;
      right: 0;
      top: 1100px;
      text-align: center;
      font-family: "JetBrains Mono", monospace;
      font-weight: 500;
      font-size: 26px;
      line-height: 1.3;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #4a6179;
      white-space: nowrap;
    }
    #f04-offer .f04-dot {
      padding: 0 0.2em;
    }
  </style>

  <div id="root" data-composition-id="04-promesse" data-start="0" data-duration="2.7" data-width="1080" data-height="1920">
    <!-- Ground: ivory field + static photographic grain -->
    <div id="f04-ground" class="clip" data-start="0" data-duration="2.7" data-track-index="0">
      <svg id="f04-grain" viewBox="0 0 1080 1920" preserveAspectRatio="none">
        <filter id="f04-noise" x="0" y="0" width="100%" height="100%">
          <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="11" stitchTiles="stitch" />
          <feColorMatrix type="saturate" values="0" />
        </filter>
        <rect width="1080" height="1920" filter="url(#f04-noise)" />
      </svg>
    </div>

    <!-- Content -->
    <div id="f04-content" class="clip" data-start="0" data-duration="2.7" data-track-index="1">
      <div id="f04-ghost" data-layout-allow-overflow><div id="f04-ghost-screen"></div></div>

      <div id="f04-notif">
        <div id="f04-notif-card">
          <div id="f04-notif-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="#FBF6EA" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="5" width="18" height="14" rx="2.6" />
              <path d="M3.8 6.6 12 12.6l8.2-6" />
            </svg>
          </div>
          <div id="f04-notif-body">
            <div id="f04-notif-meta">
              <span>Email<span class="f04-dot">·</span>maintenant</span>
              <span id="f04-notif-unread"></span>
            </div>
            <div id="f04-notif-title">Nouveau rendez-vous&nbsp;:<br />Julie Martin · Soin visage éclat</div>
            <div id="f04-notif-line">Vendredi 2 octobre · 10:30 · avec Camille</div>
          </div>
        </div>
      </div>

      <div id="f04-promise">
        <div id="f04-title">
          <span class="f04-line"><span class="f04-mask" data-layout-allow-overflow><span class="f04-word">De</span></span><span class="f04-mask" data-layout-allow-overflow><span class="f04-word">votre</span></span><span class="f04-mask" data-layout-allow-overflow><span class="f04-word">fiche</span></span><span class="f04-mask" data-layout-allow-overflow><span class="f04-word">Google</span></span></span>
          <span class="f04-line"><span class="f04-mask" data-layout-allow-overflow><span class="f04-word">à</span></span><span class="f04-mask" data-layout-allow-overflow><span class="f04-word">votre</span></span><span class="f04-mask" data-layout-allow-overflow><span class="f04-word">agenda</span></span></span>
          <span class="f04-line"><span class="f04-mask" data-layout-allow-overflow><span class="f04-word">en</span></span><span class="f04-mask" data-layout-allow-overflow><span class="f04-word">quelques</span></span><span class="f04-mask" data-layout-allow-overflow><span class="f04-word">minutes.</span></span></span>
        </div>
        <div id="f04-rule"></div>
        <div id="f04-offer">7 jours gratuits<span class="f04-dot">·</span>sans carte bancaire</div>
      </div>
    </div>
  </div>

  <script src="assets/gsap.min.js"></script>
  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // ── Scene 1 (0.0–0.8): the previous phone recedes, blurred; the email notification lands ──
      tl.fromTo(
        "#f04-ghost",
        { scale: 1, y: 0, opacity: 0.5, filter: "blur(16px)" },
        { scale: 0.8, y: 40, opacity: 0, filter: "blur(30px)", duration: 0.9, ease: "power2.out" },
        0,
      );
      tl.fromTo(
        "#f04-notif",
        { y: -150, scale: 0.96, opacity: 0, filter: "blur(10px)" },
        { y: 0, scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.62, ease: "expo.out" },
        0.04,
      );
      // unread dot: a quiet settle as the card lands (on the ding)
      tl.fromTo("#f04-notif-unread", { scale: 0 }, { scale: 1, duration: 0.3, ease: "power3.out" }, 0.38);

      // ── Scene 2 (0.7–2.2): the notification drifts up and dissolves; the promise rises word by word ──
      tl.to(
        "#f04-notif",
        { y: -120, scale: 0.94, opacity: 0, filter: "blur(8px)", duration: 0.46, ease: "power2.in" },
        0.8,
      );

      tl.fromTo(
        "#f04-title .f04-word",
        { yPercent: 105, opacity: 0 },
        { yPercent: 0, opacity: 1, duration: 0.62, ease: "power3.out", stagger: 0.045 },
        0.98,
      );
      // very slow settle under the hold (life in the stillness)
      tl.fromTo("#f04-promise", { scale: 1.015 }, { scale: 1, duration: 1.22, ease: "power2.out" }, 0.98);

      tl.fromTo("#f04-rule", { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.5, ease: "expo.out" }, 1.45);
      tl.fromTo(
        "#f04-offer",
        { y: 14, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        1.5,
      );

      tl.set({}, {}, 2.2);
      window.__timelines["04-promesse"] = tl;
    })();
  </script>
</template>
