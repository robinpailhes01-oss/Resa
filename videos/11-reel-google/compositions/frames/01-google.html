  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Camera: single wrapper, origin 0 0 → screen = (x, y) + s · world.
      // Handoff: the input (world 160..920 × 568..664, centre 540,616) sits at (540,1180), 920×116 at t=0.
      const S0 = 920 / 760;
      const cam = (s, cx, cy, sx, sy) => ({ scale: s, x: sx - cx * s, y: sy - cy * s });
      const C0 = cam(S0, 540, 616, 540, 1180);
      const C1 = cam(1.17, 540, 616, 540, 1150);
      const C2 = cam(1.14, 540, 640, 540, 1150);
      const C3 = cam(0.82, 540, 568, 540, 345);

      gsap.set("#f01-world", { transformOrigin: "0 0" });

      // ── Scene 1 (0.0–0.6): the hook pill lands and becomes the search field; the block composes around it ──
      tl.fromTo("#f01-world", C0, { ...C1, duration: 0.8, ease: "expo.out" }, 0);
      tl.to("#f01-world", { ...C2, duration: 1.5, ease: "sine.inOut" }, 0.8);
      tl.fromTo("#f01-depth", { scale: 1.12, y: 40 }, { scale: 1.02, y: -30, duration: 4.2, ease: "none" }, 0);

      tl.fromTo("#f01-input", { borderRadius: 48, borderColor: "rgba(142,135,120,0)" }, { borderRadius: 24, borderColor: "rgba(142,135,120,1)", duration: 0.5, ease: "power3.out" }, 0.05);
      tl.fromTo(["#f01-plinth", "#f01-card"], { opacity: 0, scale: 0.985 }, { opacity: 1, scale: 1, duration: 0.6, ease: "power3.out", stagger: 0.05 }, 0.04);
      tl.fromTo("#f01-sec-bg", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 0.1);
      tl.fromTo(
        ["#f01-h-title", "#f01-h-intro", "#f01-sec-title", "#f01-sec-intro"],
        { opacity: 0, y: 26, filter: "blur(6px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.6, ease: "power3.out", stagger: 0.06 },
        0.12,
      );
      tl.fromTo("#f01-h-rule", { scaleX: 0, transformOrigin: "0 50%" }, { scaleX: 1, duration: 0.7, ease: "expo.out" }, 0.25);
      tl.fromTo("#f01-btn", { opacity: 0, y: 30 }, { opacity: 0.6, y: 0, duration: 0.55, ease: "power3.out" }, 0.2);
      tl.fromTo("#f01-fields", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.3);
      tl.fromTo("#f01-label", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.12);
      tl.fromTo("#f01-label-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "expo.out" }, 0.2);

      // caret blinking before the paste (hook continuity)
      tl.set("#f01-caret-a", { opacity: 1 }, 0);
      tl.set("#f01-caret-a", { opacity: 0 }, 0.26);
      tl.set("#f01-caret-a", { opacity: 1 }, 0.44);
      tl.set(["#f01-caret-a", "#f01-ph", "#f01-link-ic"], { opacity: 0 }, 0.55);
